[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["LICENSES"]

[tool.ruff.lint]
# Release-critical static checks. Structural/type/debt policy is enforced by
# scripts/check_zero_debt.py and pytest rather than by style-only Ruff rules.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
