# SPDX-License-Identifier: CERN-OHL-S-2.0
name: CH025 expanded BCu and native L3 removal refill

on:
  push:
    branches: [codex/ch025-l3-native-refill-audit-2026-10-21]
    paths:
      - ".github/workflows/ch022-agnd-layer-hop.yml"
      - "hardware/eeg128-tdm/probe_ch022_agnd_hop.py"
      - "hardware/eeg128-tdm/probe_ch022_bcu_in2_bypass.py"
      - "hardware/eeg128-tdm/analyze_ch022_multihop_graph.py"
      - "hardware/eeg128-tdm/analyze_ch022_in2_gap_blockers.py"
      - "hardware/eeg128-tdm/analyze_ch022_in2_gap_virtual.py"
      - "hardware/eeg128-tdm/probe_ch022_ch025_dual_route.py"
      - "hardware/eeg128-tdm/analyze_ch025_route_topology.py"
      - "hardware/eeg128-tdm/analyze_ch025_existing_via_anchor.py"
      - "hardware/eeg128-tdm/analyze_ch025_reused_via_pairs.py"
      - "hardware/eeg128-tdm/analyze_ch025_l3_native_refill.py"
      - "hardware/eeg128-tdm/test_ch025_l3_native_refill.py"
      - "hardware/eeg128-tdm/test_ch025_reused_via_pairs.py"
      - "hardware/eeg128-tdm/test_ch025_existing_via_anchor.py"
      - "hardware/eeg128-tdm/test_ch025_route_topology.py"
      - "hardware/eeg128-tdm/test_ch022_ch025_dual_route.py"
      - "hardware/eeg128-tdm/test_ch022_in2_gap_virtual.py"
      - "hardware/eeg128-tdm/test_ch022_in2_gap_blockers.py"
      - "hardware/eeg128-tdm/test_ch022_multihop_graph.py"
      - "hardware/eeg128-tdm/test_ch022_bcu_in2_bypass.py"
      - "hardware/eeg128-tdm/probe_ch022_fcu_micro.py"
      - "hardware/eeg128-tdm/analyze_ch025_via_guard.py"
      - "hardware/eeg128-tdm/probe_ch025_interior_virtual.py"
      - "hardware/eeg128-tdm/test_ch025_interior_virtual.py"
      - "hardware/eeg128-tdm/test_ch022_fcu_micro.py"
      - "hardware/eeg128-tdm/probe_block2_r302_joint.py"
      - "hardware/eeg128-tdm/probe_ch025_interior_virtual.py"
      - "hardware/eeg128-tdm/test_ch022_agnd_hop.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ch022-agnd-crossing:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        radius: ["0.35", "0.65"]
    steps:
      - uses: actions/checkout@v4
      - name: Install exact KiCad 8.0.9 and Shapely
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad python3-numpy python3-shapely python3-pip
          sudo /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps 'shapely==2.1.2'
          test "$(kicad-cli version)" = "8.0.9"
      - name: Test fail-closed guards before board experiment
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_agnd_hop.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_fcu_micro.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_interior_virtual.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_bcu_in2_bypass.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_multihop_graph.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_in2_gap_blockers.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_in2_gap_virtual.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch022_ch025_dual_route.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_route_topology.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_existing_via_anchor.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_reused_via_pairs.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_l3_native_refill.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch017_ch022_restitution.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch026_r302_joint.py -v
      - name: Evaluate strict BCu to In2Cu transition and guarded full-board candidate
        timeout-minutes: 60
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_r302_joint.py \
            --archive hardware/eeg128-tdm/engineering/followup-2026-10-16-mux137/joint-unadopted137.zip \
            --joint-order interleave --ch022-root R302.1 \
            --reserve-radius ${{ matrix.radius }} \
            --ch022-via-plan --ch026-escape-cut --ch026-restore-early \
            --ch017-local-restore --ch022-bcu-inventory --ch022-in2-bypass \
            --output /tmp/ch022-bcu-in2-bypass-${{ matrix.radius }}.json
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          d=json.loads(Path('/tmp/ch022-bcu-in2-bypass-'+os.environ['RADIUS']+'.json').read_text())
          for key in ('accepted','routing_completed','fabrication_release',
                      'native_qualification','independent_replay_verified',
                      'manufacturing_files'):
              assert d.get(key) is False, key
          assert d.get('status') != 'diagnostic_exception', d.get('detail')
          assert d.get('ch017_native_continuity_ok') is True, 'CH017 must remain natively connected'
          if d.get('status') == 'ch022_interleaved_BCu_blocked':
              in2 = d.get('ch022_in2_bypass_analysis')
              assert in2 is not None, 'Missing BCu/In2Cu analysis'
              assert in2['foreign_FCu_mutation'] is False
              assert in2['layers_only'] == ['B.Cu', 'In2.Cu']
              assert in2['L3_loss_qualified'] is False
              assert in2['L3_gain_qualified'] is False
              assert in2.get('multihop_component_graph', {}).get('read_only') is True
              assert in2['multihop_component_graph']['accepted'] is False
              inv = in2.get('in2_gap_uuid_inventory')
              assert inv is not None, 'Missing In2 gap UUID inventory'
              assert inv['accepted'] is False
              assert inv['VCM_modified'] is False
              assert inv['other_nets_modified'] is False
              assert inv['power_outline_keepout_mm'] == .505
              assert inv['status'] == 'UUID_inventory_only_no_mutation'
              trial = in2.get('ch025_N_MUX_virtual')
              assert trial is not None, 'Missing UUID pinned in-memory gap test'
              assert trial['accepted'] is False
              assert trial['fabrication_release'] is False
              assert trial['CH025_N_MUX_restitution_qualified'] is False
              delta = trial.get('CH025_native_3V3A_removal_delta')
              assert delta is not None, 'Missing native 3V3A differential test'
              assert delta['accepted'] is False
              assert delta['fabrication_release'] is False
              assert delta['native_zone_fill_executed'] is True
              assert delta['tracks_restored'] is True
              assert delta['native_zone_fill_restored'] is True
              print('CH025_NATIVE_REMOVAL_ONLY_L3', delta['status'],
                    'loss_mm2', delta['loss_mm2'],
                    'gain_mm2', delta['gain_mm2'], flush=True)
              dual = trial.get('dual_routing_attempt')
              if trial.get('CH022_virtual_component_connected') is True:
                  assert dual is not None, 'Missing dual-route test after topology proof'
                  assert dual['accepted'] is False
                  assert dual['fabrication_release'] is False
                  assert dual['retained_original_copper_verified'] is True
                  assert all(a['new_copper_removed'] for a in dual['attempts'])
                  for attempt in dual['attempts']:
                      diag = attempt.get('ch025_anchor_cut_diagnostic')
                      if attempt['status'] == 'mesh_unreachable_CH025_N_MUX':
                          assert diag is not None, 'Missing CH025 cut diagnosis'
                          assert diag['accepted'] is False
                          assert diag['read_only'] is True
                          via_report = attempt.get('CH025_target_connected_vias', {})
                          if via_report:
                              assert via_report['accepted'] is False
                              assert via_report['fabrication_release'] is False
                              pair = attempt.get('CH025_reused_via_pair_analysis')
                              if pair is not None:
                                  assert pair['accepted'] is False
                                  assert pair['fabrication_release'] is False
                                  assert pair['new_vias_allowed'] is False
                                  print('CH025_REUSED_VIA_PAIRS', pair['status'],
                                        pair['source_connected_vias'].get('via_candidates', []),
                                        pair['candidates'], flush=True)
                              print('CH025_EXISTING_VIA', via_report['status'],
                                    via_report.get('via_candidates', [])[:4],
                                    'fallback_trials', attempt.get('CH025_existing_via_fallback_trials', []),
                                    flush=True)
                          print('CH025_ROUTE_CUT', attempt['order'],
                                diag['status'], diag['source'],
                                diag['target'],
                                diag.get('minimum_layer_transitions'),
                                flush=True)
                  print('DUAL_ROUTE', dual['status'],
                        [(a['order'], a['status']) for a in dual['attempts']],
                        flush=True)
              if trial.get('original_segment_restored'):
                  assert trial['all_track_geometries_restored'] is True
              print('PINNED_CH025_N_MUX_VIRTUAL', trial.get('status'),
                    trial.get('CH022_virtual_component_connected'), flush=True)
              print('IN2_GAP_INVENTORY', inv['gap_length_mm'],
                    'power_intersects', inv['gap_power_keepout_intersects'],
                    'objects', inv['object_count'],
                    'protected', inv['protected_barrier_uuids'][:12],
                    'potential_candidates',
                    inv['candidate_requiring_restitution_uuids'][:12],
                    flush=True)
              print('IN2_BYPASS_DIAGNOSTIC', in2.get('status'),
                    'direct_components', in2.get('reachable_via_component_count'),
                    'graph_connected', in2['multihop_component_graph']['multihop_connected'],
                    flush=True)
          if d.get('status') == 'native_audit_only_unaccepted':
              assert d['ch017_native_continuity_ok'] is True
              assert d['L3_loss_mm2'] == 0.0
              assert d['L3_gain_mm2'] == 0.0
              assert d['zone_outlines_unchanged'] is True
              assert not d['regressed_nets'], d['regressed_nets']
              assert d['drc_violations'] == 0 and d['drc_warnings'] == 0
              assert all(v == 0 for v in d['critical_native_unconnected'].values())
          print('DIAGNOSTIC_ONLY',d.get('status'),'hop',d.get('ch022_agnd_hop_analysis',{}).get('status'),
                'CH017_ok',d.get('ch017_native_continuity_ok'),
                'in2',d.get('ch022_in2_bypass_analysis',{}).get('status'),
                'airwires',d.get('drc_unconnected'),
                '136_replay_candidate',d.get('candidate_136_eligible_for_independent_replay'),
                flush=True)
          PY
        env:
          RADIUS: ${{ matrix.radius }}
      - name: Retain JSON only; absolutely no PCB or manufacturing exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch022-bcu-in2-bypass-${{ matrix.radius }}
          path: /tmp/ch022-bcu-in2-bypass-${{ matrix.radius }}.json
          if-no-files-found: ignore
