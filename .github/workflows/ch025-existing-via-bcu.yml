# SPDX-License-Identifier: AGPL-3.0-only
name: Native CH025 existing four via BCu closure
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/ch025-existing-via-bcu.yml"
      - "hardware/eeg128-tdm/probe_ch025_existing_vias_bcu.py"
      - "hardware/eeg128-tdm/test_ch025_existing_vias_bcu.py"
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned KiCad and geometry
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew,shapely;assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Static protected via contract
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_existing_vias_bcu.py -v
      - name: Recreate protected MUX_EN CH019 candidate
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH025-existing-base.json \
            --candidate-output /tmp/CH025-existing-base.zip
      - name: Test four existing CH025 BCu via pair routes
        timeout-minutes: 11
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch025_existing_vias_bcu.py \
            --candidate /tmp/CH025-existing-base.zip \
            --output /tmp/CH025-existing-Bcu.json
      - name: Fail closed gate
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/CH025-existing-Bcu.json').read_text())
          assert d['source_archive_unchanged']
          assert d['baseline_native_DRC']=={'violations':0,'warnings':0,'unconnected':139}
          assert d['protected_originals_preserved']
          assert d['new_via_count']==0
          assert len(d['existing_CH025_vias'])==4
          assert d['BCu_gap_barrier_inventory'] is not None
          assert d['BCu_alternative_component_graph'] is not None
          g=d['BCu_alternative_component_graph']
          assert not g['survey_truncated']
          assert g['evaluated_gap_count']==g['candidate_gap_count']
          assert d['micro_ripup_trial']['restored']
          assert not d['micro_ripup_trial']['DRC_qualified']
          assert not d['micro_ripup_trial']['physical_closure_qualified']
          for k in ('accepted','fabrication_release','routing_completed',
                    'checkpoint_promoted','manufacturing_files','In1_Cu_used'):
              assert d[k] is False, k
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Export report JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CH025-existing-via-native-Bcu-screen
          path: /tmp/CH025-existing-Bcu.json
          if-no-files-found: ignore
