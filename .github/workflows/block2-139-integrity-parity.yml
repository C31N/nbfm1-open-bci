# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 139 schematic parity integrity (no-release)

on:
  workflow_dispatch:
  push:
    branches: [codex/block2-predictive-restitution-2026-10-30]
    paths:
      - ".github/workflows/block2-139-integrity-parity.yml"
      - "hardware/eeg128-tdm/board_scratch_integrity.py"
      - "hardware/eeg128-tdm/probe_mux_en_multihop_route.py"
      - "hardware/eeg128-tdm/eeg128-tdm.kicad_sch"

permissions:
  contents: read

jobs:
  integrity-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned KiCad 8.0.9 Python environment
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Reproduce protected 139 MUX_EN source
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/139-replay-proof.json \
            --candidate-output /tmp/pinned-139-integrity.zip
      - name: Native 139 DRC and non-mutating schematic parity
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          import pcbnew

          sys.path.insert(0, "hardware/eeg128-tdm")
          from board_scratch_integrity import component_inventory

          root = Path("/tmp/block2-pinned-139-parity")
          root.mkdir(parents=True, exist_ok=False)
          archive = Path("/tmp/pinned-139-integrity.zip")
          names = {
              "eeg128-tdm.kicad_pcb",
              "eeg128-tdm.kicad_pro",
              "eeg128-tdm.kicad_dru",
          }
          with zipfile.ZipFile(archive) as src:
              if not names.issubset(set(src.namelist())):
                  raise RuntimeError("Pinned 139 archive missing KiCad inputs")
              for name in sorted(names):
                  (root / name).write_bytes(src.read(name))
          shutil.copyfile(
              "hardware/eeg128-tdm/eeg128-tdm.kicad_sch",
              root / "eeg128-tdm.kicad_sch",
          )
          board_path = root / "eeg128-tdm.kicad_pcb"
          board = pcbnew.LoadBoard(str(board_path))
          if board is None:
              raise RuntimeError("Cannot open pinned 139 PCB")
          components = component_inventory(board)
          pad_count = sum(len(entry[-1]) for entry in components.values())
          if pad_count < 2000:
              raise RuntimeError(f"Unexpected pad count: {pad_count}")

          report_path = root / "native-parity-drc.json"
          result = subprocess.run(
              [
                  "kicad-cli", "pcb", "drc",
                  "--schematic-parity", "--format", "json",
                  "--severity-all", "--all-track-errors",
                  "--output", str(report_path), str(board_path),
              ],
              capture_output=True, text=True, check=False,
          )
          if result.returncode not in (0, 5) or not report_path.exists():
              raise RuntimeError(
                  f"Native parity process failed: {result.returncode} "
                  f"{result.stderr[-1200:]}"
              )
          report = json.loads(report_path.read_text())
          metrics = {
              "kicad_version": report.get("kicad_version"),
              "footprints": len(components),
              "pads": pad_count,
              "schematic_parity_items": len(report.get("schematic_parity", [])),
              "violations": len(report.get("violations", [])),
              "unconnected": len(report.get("unconnected_items", [])),
              "accepted": False,
              "routing_completed": False,
              "fabrication_release": False,
          }
          print(json.dumps(metrics, sort_keys=True))
          if not report.get("kicad_version", "").startswith("8.0.9"):
              raise RuntimeError("KiCad 8.0.9 parity gate failed")
          if (metrics["schematic_parity_items"] != 0
                  or metrics["violations"] != 0
                  or metrics["unconnected"] != 139):
              raise RuntimeError("139 source failed DRC/schematic-parity gate")
          (root / "native-parity-summary.json").write_text(
              json.dumps(metrics, indent=2) + "\n"
          )
          PY
      - name: Upload diagnostic evidence only (no fabrication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Block2-Pinned139-Parity
          path: |
            /tmp/139-replay-proof.json
            /tmp/block2-pinned-139-parity/native-parity-summary.json
            /tmp/block2-pinned-139-parity/native-parity-drc.json
          if-no-files-found: ignore
