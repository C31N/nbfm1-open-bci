# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 CH038-plus-201 joint FCu corridor upperbound no-release
on:
  workflow_dispatch:
  push:
    branches: [codex/block2-predictive-restitution-2026-10-30]
    paths:
      - ".github/workflows/block2-ch038-joint-upperbound.yml"
      - "hardware/eeg128-tdm/probe_block2_ch038_restitution.py"
      - "hardware/eeg128-tdm/test_block2_ch038_restitution.py"
permissions:
  contents: read
jobs:
  ch038-restitution:
    strategy:
      fail-fast: false
      matrix:
        target: [CH028_N_MUX, CH029_N_MUX, CH030_N_MUX]
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native KiCad geometry dependencies
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Verify CH038 exact UUID and no-release constraints
        run: |
          /usr/bin/python3 -m py_compile hardware/eeg128-tdm/probe_block2_ch038_restitution.py
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_ch038_restitution.py -v
      - name: Reproduce pinned 139 MUX_EN source
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH038-pinned-base.json \
            --candidate-output /tmp/CH038-pinned-base.zip
      - name: Pre-route CH038 and assess one upperbound target component
        timeout-minutes: 22
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_ch038_restitution.py \
            --candidate /tmp/CH038-pinned-base.zip \
            --target ${{ matrix.target }} \
            --output /tmp/CH038-plus201-${{ matrix.target }}.json
      - name: Fail closed independent of outcome
        run: |
          TARGET=${{ matrix.target }} /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/CH038-plus201-'+os.environ['TARGET']+'.json').read_text())
          assert d['target']==os.environ['TARGET']
          assert d['joint_upperbound_only'] is True
          assert d['ch038_restitution_DRC_qualified'] is False
          assert d['candidate_DRC'] is None
          assert d['worker']['201_other_UUIDs_removed_for_geometry_only']==201
          assert d['worker']['other_201_original_tracks_preserved'] is False
          assert d['worker']['joint_upperbound_only'] is True
          assert d['worker']['ch038_both_replacements_found'] is True
          assert d['worker']['target_reachable_before_CH038_return']['same_component'] is True
          assert d['worker']['target_reachable_after_CH038_return'] is not None
          assert d['status'] in ('CH038_plus_201_topology_reachable_no_release',
                                 'CH038_plus_201_topology_partitioned_no_release')
          assert d['baseline_DRC']=={'violations':0,'warnings':0,'unconnected':139}
          assert d['source_archive_unchanged']
          assert d['three_target_136_qualified'] is False
          for k in ('accepted','routing_completed','fabrication_release',
                    'manufacturing_files','checkpoint_promoted',
                    'schematic_parity_qualified','independent_replay_verified'):
              assert d[k] is False,k
          assert d['new_vias_added']==0
          assert d['three_target_136_qualified'] is False
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Publish only no-release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Block2-CH038-joint-upperbound-${{ matrix.target }}
          path: /tmp/CH038-plus201-${{ matrix.target }}.json
          if-no-files-found: ignore
