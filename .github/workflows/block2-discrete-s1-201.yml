# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 discrete 3-S1 routes CH018P exact201 no-release
on:
  workflow_dispatch:
  push:
    branches: [codex/block2-predictive-restitution-2026-10-30]
    paths:
      - ".github/workflows/block2-discrete-s1-201.yml"
      - "hardware/eeg128-tdm/probe_block2_discrete_s1_201.py"
      - "hardware/eeg128-tdm/test_block2_discrete_s1_201.py"
permissions:
  contents: read
jobs:
  ch038-restitution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native KiCad geometry dependencies
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Verify CH038 exact UUID and no-release constraints
        run: |
          /usr/bin/python3 -m py_compile hardware/eeg128-tdm/probe_block2_discrete_s1_201.py
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_discrete_s1_201.py -v
      - name: Reproduce pinned 139 MUX_EN source
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH038-pinned-base.json \
            --candidate-output /tmp/CH038-pinned-base.zip
      - name: Try three static S1 FCu alternatives, CH018P and all 201 victim returns
        timeout-minutes: 20
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_discrete_s1_201.py \
            --candidate /tmp/CH038-pinned-base.zip \
            --output /tmp/discrete-CH018P-S1-201.json
      - name: Verify fail-closed exact 201 inventory, pinned CH038 and no fabrication
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/discrete-CH018P-S1-201.json').read_text())
          assert d['source_archive_unchanged']
          assert d['baseline_DRC']=={'violations':0,'warnings':0,'unconnected':139}
          assert d['CH038_pre_return_DRC']=={'violations':0,'warnings':0,'unconnected':139}
          assert d['child_exit_code']==0,d.get('child_stderr_tail')
          w=d['child_diagnostic']
          assert w and w['original_victim_count']==201
          assert w['S1_UUID']=='2ac3aecb-9a62-4bc7-846a-75a782ad0474'
          assert w['source_file_unchanged'] is True
          assert w['S2_S3_original_copper_readded'] is True
          assert w['topological_independence_proven'] is False
          assert len(w['eligible_victim_UUIDs'])==201
          assert not set(w['eligible_victim_UUIDs']).intersection((
              '1a5c9937-f30d-4bf9-b20a-c65f47d46040',
              'f1271355-bfbd-4e09-b95f-b9d10b867e72'))
          for obj in (d,w):
              for k in ('accepted','routing_completed','fabrication_release',
                        'manufacturing_files','checkpoint_promoted',
                        'schematic_parity_qualified','independent_replay_verified'):
                  assert obj[k] is False,k
              assert obj['new_vias_added']==0
          for metrics in d['native_candidate_metrics'].values():
              assert set(metrics)=={'violations','warnings','unconnected'}
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Publish only no-release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Block2-discrete-S1-CH018P-exact201
          path: /tmp/discrete-CH018P-S1-201.json
          if-no-files-found: ignore
