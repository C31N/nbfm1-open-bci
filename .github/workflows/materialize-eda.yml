name: Materialize EDA Connectivity Schematic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-eda.yml"
      - ".github/workflows/kicad-native.yml"
      - "hardware/eeg128-tdm/BOM.csv"
      - "hardware/eeg128-tdm/eeg128-tdm.kicad_pcb"
      - "hardware/eeg128-tdm/generate_schematic.py"
      - "hardware/eeg128-tdm/generate_symbol_library.py"
      - "hardware/eeg128-tdm/normalize_connectivity.py"
      - "hardware/eeg128-tdm/prepare_autoroute.py"
      - "hardware/eeg128-tdm/apply_board_constraints.py"
      - "hardware/eeg128-tdm/verify_hardware_identity.py"
      - "hardware/eeg128-tdm/canonicalize_critical_footprints.py"
      - "hardware/eeg128-tdm/eeg128-tdm.kicad_dru"
      - "hardware/eeg128-tdm/eeg128-tdm.kicad_pro"
      - "hardware/eeg128-tdm/NBFM1_A2.pretty/**"
      - "hardware/eeg128-tdm/sym-lib-table"

permissions:
  contents: write

concurrency:
  group: materialize-eda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use exact KiCad 8.0.9 and matching system pcbnew
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          /usr/bin/python3 -c 'import pcbnew; assert pcbnew.Version().startswith("8.0.9")'
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends git python3-numpy python3-shapely python3-pip
          test -d /usr/share/kicad/footprints
          echo "KiCad 8.0.9 and pcbnew verified, no Launchpad PPA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Normalize primary A1 connectivity
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/normalize_connectivity.py \
            --input hardware/eeg128-tdm/eeg128-tdm.kicad_pcb \
            --output hardware/eeg128-tdm/eeg128-tdm.kicad_pcb

      - name: Canonicalize critical mixed-signal footprints
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/canonicalize_critical_footprints.py \
            --input hardware/eeg128-tdm/eeg128-tdm.kicad_pcb \
            --output hardware/eeg128-tdm/eeg128-tdm.kicad_pcb

      - name: Apply controlled four-layer stackup
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/apply_board_constraints.py \
            hardware/eeg128-tdm/eeg128-tdm.kicad_pcb

      - name: Generate deterministic KiCad connectivity schematic
        run: |
          python hardware/eeg128-tdm/generate_schematic.py \
            --output hardware/eeg128-tdm/eeg128-tdm.generated.kicad_sch
          cp hardware/eeg128-tdm/eeg128-tdm.generated.kicad_sch \
            hardware/eeg128-tdm/eeg128-tdm.kicad_sch

      - name: Generate local KiCad symbol library
        run: python hardware/eeg128-tdm/generate_symbol_library.py

      - name: Verify BOM, CPL, footprints and critical pinouts
        run: |
          python hardware/eeg128-tdm/verify_hardware_identity.py \
            --json-out /tmp/hardware-identity.json

      - name: Validate generated object counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("hardware/eeg128-tdm/eeg128-tdm.generated.kicad_sch")
          text = path.read_text(encoding="utf-8")
          instances = len(re.findall(r"(?m)^  \(symbol$", text))
          wires = len(re.findall(r"(?m)^  \(wire$", text))
          if instances != 642:
              raise SystemExit(f"expected 642 symbol instances, got {instances}")
          if wires < 1000:
              raise SystemExit(f"expected >1000 wire stubs, got {wires}")
          print({"instances": instances, "wires": wires, "bytes": path.stat().st_size})
          PY

      - name: Restore non-generated project metadata
        run: |
          git restore --worktree -- hardware/eeg128-tdm/eeg128-tdm.kicad_pro

      - name: Refresh and verify release manifest
        run: |
          bash scripts/generate_release_manifest.sh
          bash scripts/verify_release_manifest.sh

      - name: Commit generated EDA and manifest if changed
        run: |
          git add \
            hardware/eeg128-tdm/eeg128-tdm.kicad_pcb \
            hardware/eeg128-tdm/eeg128-tdm.generated.kicad_sch \
            hardware/eeg128-tdm/eeg128-tdm.kicad_sch \
            hardware/eeg128-tdm/NBFM1_A0.kicad_sym \
            PUBLICATION_SHA256SUMS
          if git diff --cached --quiet; then
            echo "Generated EDA and manifest are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize generated KiCad schematic and release manifest"

          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          source_head="$(git rev-parse HEAD^)"
          if [ "$remote_head" != "$source_head" ]; then
            echo "Branch advanced from $source_head to $remote_head; stale generated output is not pushed."
            exit 0
          fi

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Branch advanced during push; leave the newer materialization run to publish its output."
            exit 0
          fi
