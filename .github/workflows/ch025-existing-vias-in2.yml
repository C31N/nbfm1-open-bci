# SPDX-License-Identifier: AGPL-3.0-only
name: Native CH025 existing vias In2 exact zone route
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/ch025-existing-vias-in2.yml"
      - "hardware/eeg128-tdm/probe_ch025_existing_vias_in2.py"
      - "hardware/eeg128-tdm/test_ch025_existing_vias_in2.py"
permissions:
  contents: read
jobs:
  in2-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned KiCad 8.0.9
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Check no-release In2 existing-via contract
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_existing_vias_in2.py -v
      - name: Recreate SHA-pinned 139 engineering board
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH025-in2-base.json \
            --candidate-output /tmp/CH025-in2-base.zip
      - name: Native In2 exact 3V3A CH025 via-only trial
        timeout-minutes: 9
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch025_existing_vias_in2.py \
            --candidate /tmp/CH025-in2-base.zip \
            --output /tmp/CH025-in2-native.json
      - name: Verify original rollback and release lock
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/CH025-in2-native.json').read_text())
          assert d['source_archive_unchanged']
          assert d['native_139_baseline']=={'violations':0,'warnings':0,'unconnected':139}
          assert d['source_originals_unchanged']
          assert d['all_existing_vias_unchanged']
          assert d['native_In1_exact'] and d['native_3V3A_exact']
          assert d['new_vias_added']==0
          assert len(d['existing_CH025_vias'])==4
          assert len(d['existing_via_pairs'])==4
          for key in ('accepted','fabrication_release','routing_completed',
                      'manufacturing_files','checkpoint_promoted',
                      'In1_Cu_used','native_136_qualified'):
              assert d[key] is False, key
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Upload native JSON only even on timeout or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CH025-existing-In2-native-via-only
          path: /tmp/CH025-in2-native.json
          if-no-files-found: ignore
