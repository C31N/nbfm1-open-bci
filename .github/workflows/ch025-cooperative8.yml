# SPDX-License-Identifier: AGPL-3.0-only
name: CH025 cooperative eight-net F.Cu probe
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/ch025-cooperative8.yml"
      - "hardware/eeg128-tdm/probe_ch025_cooperative8.py"
      - "hardware/eeg128-tdm/test_ch025_cooperative8.py"
      - "hardware/eeg128-tdm/ch025_ripup_backtrack.py"
      - "hardware/eeg128-tdm/test_ch025_ripup_backtrack.py"
      - "hardware/eeg128-tdm/ch025_mux_joint.py"
      - "hardware/eeg128-tdm/test_ch025_mux_joint.py"
permissions:
  contents: read
jobs:
  cooperative:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: KiCad 8.0.9 and Shapely 2.1.2 environment
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew,shapely; assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Verify fail-closed priority schedules
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_cooperative8.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_ripup_backtrack.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_mux_joint.py -v
      - name: Bounded eight-net BPS plus native geometry on immutable PCB
        timeout-minutes: 19
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch025_cooperative8.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/ch025-cooperative8.json \
            --max-orders 4 --max-margin 6.0 --order-budget 140.0
      - name: Assert checkpoint is NOT promoted and manufacturing is disabled
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/ch025-cooperative8.json").read_text())
          assert x["source_archive_sha256"] == "f022d711bf860c6ec9383dae6f511c41189bf7348035d8d1e5e0e0ca6bcd6d1b"
          assert x["source_pcb_sha256"] == "f2780989e2dee6233f207df1f420f7e89d8e855493eb6b1e7fb731d4a4dda1ea"
          assert x["baseline_airwires"]==139 and x["target_airwires"]==136
          assert x["F_Cu_only"] is True and x["In1_Cu_used"] is False
          for key in ("accepted","routing_completed","fabrication_release",
                      "manufacturing_files","checkpoint_promoted",
                      "independent_replay_verified","checkpoint_replaced",
                      "manufacturing_export_invoked"):
              assert x[key] is False, key
          assert not list(Path("/tmp").rglob("*.gbr"))
          assert not list(Path("/tmp").rglob("*.drl"))
          print(x["status"], x["orders_tried"])
          PY
      - name: Upload JSON diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch025-cooperative-eight-net-native
          path: /tmp/ch025-cooperative8.json
          if-no-files-found: ignore
