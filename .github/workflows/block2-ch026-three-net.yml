# SPDX-License-Identifier: CERN-OHL-S-2.0
name: Block2 R302 CH026 three-net joint closure

on:
  push:
    branches:
      - codex/block2-ch026p-r302-escape-2026-10-18
    paths:
      - ".github/workflows/block2-ch026-three-net.yml"
      - "hardware/eeg128-tdm/probe_block2_ch026_joint136.py"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-three-net-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: one
            order: ch022-first
          - scope: one
            order: ch024-first
          - scope: pair
            order: ch022-first
          - scope: pair
            order: ch024-first
    steps:
      - uses: actions/checkout@v4
      - name: KiCad 8 native and Shapely 2.1.2
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad python3-numpy python3-shapely python3-pip
          sudo /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps 'shapely==2.1.2'
          kicad-cli version | grep '^8'
      - name: Validate immutable power J2 VCM CH018 and no-release
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_ch026_joint136.py -v
      - name: Native triple net model with full neighbor restitution
        timeout-minutes: 35
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_ch026_joint136.py \
            --archive hardware/eeg128-tdm/engineering/followup-2026-10-16-mux137/joint-unadopted137.zip \
            --scope ${{ matrix.scope }} --order ${{ matrix.order }} \
            --output /tmp/block2-three-net-${{ matrix.scope }}-${{ matrix.order }}.json
          /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/block2-three-net-'+os.environ['SCOPE']+'-'+os.environ['ORDER']+'.json').read_text())
          assert all(d[k] is False for k in ('accepted','routing_completed',
             'fabrication_release','native_qualification','independent_replay_verified',
             'manufacturing_files'))
          print(d['status'],d.get('failed_neighbor'),d.get('DRC_unconnected'))
          PY
        env:
          SCOPE: ${{ matrix.scope }}
          ORDER: ${{ matrix.order }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block2-three-net-${{ matrix.scope }}-${{ matrix.order }}
          path: /tmp/block2-three-net-${{ matrix.scope }}-${{ matrix.order }}.json
          if-no-files-found: ignore
