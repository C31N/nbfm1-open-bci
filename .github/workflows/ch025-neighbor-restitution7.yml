# SPDX-License-Identifier: AGPL-3.0-only
name: CH025 seven-neighbor native restitution diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - "hardware/eeg128-tdm/probe_ch025_neighbor_restitution7.py"
      - "hardware/eeg128-tdm/test_ch025_neighbor_restitution7.py"
      - ".github/workflows/ch025-neighbor-restitution7.yml"
permissions:
  contents: read
jobs:
  neighbor-restitution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Verify KiCad native environment
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew,shapely; assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Safety and selection regression
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_neighbor_restitution7.py -v
      - name: Native seven-neighbor F.Cu restitution search
        timeout-minutes: 18
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch025_neighbor_restitution7.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/ch025-seven-neighbor-restitution.json
      - name: Mandatory no-promote / no-manufacturing assertion
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/ch025-seven-neighbor-restitution.json")
          o=json.loads(p.read_text())
          assert o["source_pcb_sha256"] == "f2780989e2dee6233f207df1f420f7e89d8e855493eb6b1e7fb731d4a4dda1ea"
          assert o["baseline_airwires"] == 139 and o["target_airwires"] == 136
          assert o["In1_Cu_used"] is False
          for key in ("accepted","routing_completed","fabrication_release",
                      "manufacturing_files","independent_byte_replay",
                      "checkpoint_promoted","manufacturing_export_invoked"):
              assert o[key] is False, key
          print(o["status"])
          PY
      - name: Upload JSON-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch025-seven-neighbor-native-diagnostic
          path: /tmp/ch025-seven-neighbor-restitution.json
          if-no-files-found: ignore
