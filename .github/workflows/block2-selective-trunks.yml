# SPDX-License-Identifier: CERN-OHL-S-2.0
name: Block 2 selective trunk diagnostic

on:
  push:
    branches:
      - codex/block2-selective-trunks-2026-10-18
    paths:
      - ".github/workflows/block2-selective-trunks.yml"
      - "hardware/eeg128-tdm/probe_block2_selective.py"
      - "hardware/eeg128-tdm/test_block2_selective.py"
      - "hardware/eeg128-tdm/engineering/block2_ch024p_selective_guides.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective-read-only:
    strategy:
      fail-fast: false
      matrix:
        neighbor: [CH018_N_MUX, CH019_P_MUX]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 8.0.9 and geometry dependencies
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad python3-numpy python3-shapely python3-pip
          sudo /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps 'shapely==2.1.2'
          kicad-cli version | grep '^8'
      - name: Run selective-replacement guard tests
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_selective.py -v
      - name: Model selective neighbor cuts and full three-pad CH024-P path
        timeout-minutes: 30
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_selective.py \
            --archive hardware/eeg128-tdm/engineering/followup-2026-10-16-mux137/joint-unadopted137.zip \
            --output /tmp/selective-${{ matrix.neighbor }}.json \
            --neighbor ${{ matrix.neighbor }} \
            --budget 4
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          name = os.environ['TARGET_NEIGHBOR']
          obj = json.loads(Path(f'/tmp/selective-{name}.json').read_text())
          assert len(obj['trials']) == 1
          assert all(obj[k] is False for k in (
              'accepted', 'routing_completed', 'fabrication_release',
              'native_drc_qualified', 'replay_qualified', 'manufacturing_exports'
          ))
          print(obj['trials'][0]['status'])
          PY
        env:
          TARGET_NEIGHBOR: ${{ matrix.neighbor }}
      - name: Upload diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block2-selective-${{ matrix.neighbor }}
          path: /tmp/selective-${{ matrix.neighbor }}.json
          if-no-files-found: ignore
