# SPDX-License-Identifier: CERN-OHL-S-2.0
name: Block 2 CH026 interleaved pad escape and BCu closure

on:
  push:
    branches:
      - codex/block2-ch026p-r302-escape-2026-10-19
    paths:
      - ".github/workflows/block2-ch026-interleaved-restoration.yml"
      - "hardware/eeg128-tdm/probe_block2_r302_joint.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interleave-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        radius: ["0.35", "0.65", "0.95"]
    steps:
      - uses: actions/checkout@v4
      - name: Install native KiCad 8.0.9 and Shapely 2.1.2
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad python3-numpy python3-shapely python3-pip
          sudo /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps 'shapely==2.1.2'
          test "$(kicad-cli version)" = "8.0.9"
      - name: Guard unchanged J2 CH018 VCM and release interlocks
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_r302_joint.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch026_r302_joint.py -v
      - name: Preseed CH022 legal FCu vias, close CH024 and CH019, finish BCu, restore CH026
        timeout-minutes: 32
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_r302_joint.py \
            --archive hardware/eeg128-tdm/engineering/followup-2026-10-16-mux137/joint-unadopted137.zip \
            --joint-order interleave \
            --ch022-root R302.1 \
            --reserve-radius ${{ matrix.radius }} \
            --ch022-via-plan --ch026-escape-cut \
            --output /tmp/ch026-r302-interleave-${{ matrix.radius }}.json
          /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/ch026-r302-interleave-'+os.environ['RADIUS']+'.json').read_text())
          assert d['ch026_escape_cut'] and d['joint_order']=='interleave'
          assert all(d[k] is False for k in ('accepted','routing_completed',
                 'fabrication_release','independent_replay_verified',
                 'native_qualification','manufacturing_files'))
          print('status',d['status'],'pad-window',d.get('R302.1_legal_via_area_mm2'),
                'CH024',d.get('ch024_three_pads_proposed'),
                'CH019',d.get('ch019_via_bridge_proposed'),
                'CH022',d.get('ch022_interleaved_BCu_proposed'),
                'unrestored',d.get('failed_neighbor'),d.get('failed_uuid'))
          PY
        env:
          RADIUS: ${{ matrix.radius }}
      - name: Archive non-release JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch026-interleaved-${{ matrix.radius }}
          path: /tmp/ch026-r302-interleave-${{ matrix.radius }}.json
          if-no-files-found: ignore
