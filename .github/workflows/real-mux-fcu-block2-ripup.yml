# SPDX-License-Identifier: AGPL-3.0-only
name: Native real Block2 FCu micro ripup actual open MUX
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/real-mux-fcu-block2-ripup.yml"
      - "hardware/eeg128-tdm/probe_real_mux_fcu_block2_ripup.py"
      - "hardware/eeg128-tdm/test_real_mux_fcu_block2_ripup.py"
permissions:
  contents: read
jobs:
  micro:
    strategy:
      fail-fast: false
      matrix:
        net: [CH028_N_MUX, CH029_N_MUX, CH030_N_MUX]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Pinned native KiCad and geometry stack
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Fail-closed Block2 no-release invariant
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_real_mux_fcu_block2_ripup.py -v
      - name: Reconstruct source checked 139 PCB
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/micro-real-base.json \
            --candidate-output /tmp/micro-real-base.zip
      - name: Native isolated FCu Block2 micro-ripup search and rollback
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_real_mux_fcu_block2_ripup.py \
            --candidate /tmp/micro-real-base.zip \
            --net ${{ matrix.net }} \
            --output /tmp/micro-real-${{ matrix.net }}.json
      - name: Fail closed no fabrication and full original rollback
        run: |
          NET=${{ matrix.net }} /usr/bin/python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/micro-real-'+os.environ['NET']+'.json').read_text())
          assert d['native_baseline']=={
              'violations':0,'warnings':0,'unconnected':139}
          assert d['input_archive_unchanged']
          assert d['all_originals_restituted']
          assert d['native_In1_exact'] and d['native_L3_exact']
          assert d['new_vias_added']==0
          for item in d['ripup_trials']:
              assert item['originals_restituted']
              assert item['rollback_L3_exact']
              assert item['rollback_In1_exact']
          for key in ('accepted','fabrication_release','routing_completed',
                      'manufacturing_files','checkpoint_promoted',
                      'independent_replay_verified','In1_Cu_used'):
              assert d[key] is False, key
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Export only native diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-Block2-FCu-micro-${{ matrix.net }}
          path: /tmp/micro-real-${{ matrix.net }}.json
          if-no-files-found: ignore
