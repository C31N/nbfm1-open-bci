# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 N-body future-target lookahead CH038 no-release
on:
  workflow_dispatch:
  push:
    branches: [codex/block2-predictive-restitution-2026-10-30]
    paths:
      - ".github/workflows/block2-nbody-lookahead.yml"
      - "hardware/eeg128-tdm/probe_block2_nbody_201.py"
      - "hardware/eeg128-tdm/test_block2_nbody_201.py"
permissions:
  contents: read
jobs:
  ch038-restitution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {order: 0, penalty: 160}
          - {order: 2, penalty: 160}
          - {order: 5, penalty: 160}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native KiCad geometry dependencies
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Verify CH038 exact UUID and no-release constraints
        run: |
          /usr/bin/python3 -m py_compile hardware/eeg128-tdm/probe_block2_nbody_201.py
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_ch038_restitution.py -v
      - name: Reproduce pinned 139 MUX_EN source
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH038-pinned-base.json \
            --candidate-output /tmp/CH038-pinned-base.zip
      - name: Couple CH038 and three FCu targets before all 201 victim restitution
        timeout-minutes: 18
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_nbody_201.py \
            --candidate /tmp/CH038-pinned-base.zip \
            --order ${{ matrix.order }} \
            --future-lane-penalty ${{ matrix.penalty }} \
            --output /tmp/block2-nbody-lookahead-${{ matrix.order }}-${{ matrix.penalty }}.json
      - name: Fail closed; retain exact blocked victim UUIDs
        run: |
          ORDER=${{ matrix.order }} PENALTY=${{ matrix.penalty }} /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/block2-nbody-lookahead-'+os.environ['ORDER']+'-'+os.environ['PENALTY']+'.json').read_text())
          assert d['source_unchanged']
          assert d['future_lane_penalty']==float(os.environ['PENALTY'])
          assert d['child_diagnostic']['future_lane_penalty']==float(os.environ['PENALTY'])
          assert d['child_exit_code']==0, d.get('child_stderr_tail')
          w=d['child_diagnostic']
          assert w and w['original_victim_count']==201
          assert len(w['cut_whitelist_UUIDs'])==201
          assert len(w['CH038_cut_UUIDs'])==2
          assert not set(w['cut_whitelist_UUIDs']).intersection(w['CH038_cut_UUIDs'])
          assert not set(w['victims_restored_original_geometry']).intersection(w['victims_routed_new_geometry'])
          for k in ('accepted','routing_completed','fabrication_release',
                    'manufacturing_files','checkpoint_promoted',
                    'schematic_parity_qualified','independent_replay_verified'):
              assert d[k] is False and w[k] is False, k
          assert d['new_vias_added']==0 and w['new_vias_added']==0
          assert d['status'] in ('Nbody_unqualified_no_release',
                                '136_DRC_only_not_parity_L3_or_replay_qualified')
          if d['candidate_qualified_136']:
              assert d['candidate_native_DRC']=={'violations':0,'warnings':0,'unconnected':136}
              assert w['fully_restituted'] is True
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Publish only no-release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Block2-Nbody-lookahead-${{ matrix.order }}-${{ matrix.penalty }}
          path: /tmp/block2-nbody-lookahead-${{ matrix.order }}-${{ matrix.penalty }}.json
          if-no-files-found: ignore
