name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install numpy cryptography scipy

      - name: Python syntax
        run: python -m compileall -q bin scripts tests hardware/eeg128-tdm

      - name: Ruff
        run: ruff check bin scripts tests hardware/eeg128-tdm

      - name: Pytest
        run: pytest -q

      - name: Zero-debt gate
        run: python scripts/check_zero_debt.py

      - name: Manufacturing remains blocked before release
        run: python hardware/eeg128-tdm/generate_manufacturing.py --assert-blocked

      - name: Citation snapshot integrity
        run: python scripts/update_notice_citation.py --check

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: REUSE 3.0 compliance
        run: reuse lint

      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          bash -n deploy_bci_stack.sh

      - name: Release manifest freshness and verification
        run: |
          test -f PUBLICATION_SHA256SUMS
          cp PUBLICATION_SHA256SUMS /tmp/PUBLICATION_SHA256SUMS.committed
          bash scripts/generate_release_manifest.sh
          cmp --silent /tmp/PUBLICATION_SHA256SUMS.committed PUBLICATION_SHA256SUMS || {
            echo "PUBLICATION_SHA256SUMS is stale. Run ./scripts/generate_release_manifest.sh and commit it."
            diff -u /tmp/PUBLICATION_SHA256SUMS.committed PUBLICATION_SHA256SUMS || true
            exit 1
          }
          bash scripts/verify_release_manifest.sh

      - name: Hardware identity and pinout audit
        run: python hardware/eeg128-tdm/verify_hardware_identity.py

      - name: KiCad source integrity
        run: python hardware/eeg128-tdm/validate_eda.py

      - name: Generated schematic smoke test
        run: |
          python hardware/eeg128-tdm/generate_schematic.py --output /tmp/eeg128-tdm.generated.kicad_sch
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("/tmp/eeg128-tdm.generated.kicad_sch").read_text(encoding="utf-8")
          instances = len(re.findall(r"(?m)^  \(symbol$", text))
          wires = len(re.findall(r"(?m)^  \(wire$", text))
          if instances < 640:
              raise SystemExit(f"generated schematic has too few symbol instances: {instances}")
          if wires < 1000:
              raise SystemExit(f"generated schematic has too few connected pin stubs: {wires}")
          print({"instances": instances, "wires": wires})
          PY

  neuro-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU reference dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy cryptography pylsl==1.18.6 pytest
      - name: Build and test Rust ingestion ring
        run: |
          cargo test --locked --manifest-path software/neural-ring/Cargo.toml
          cargo build --locked --release --manifest-path software/neural-ring/Cargo.toml
      - name: Test model causality, ingestion and cryptographic rejection paths
        env:
          NBFM_RUST_RING: software/neural-ring/target/release/libnbfm_neural_ring.so
        run: python -m pytest -q
      - name: Run synthetic decoder interface
        run: python bin/neural_decoder.py --iterations 30
