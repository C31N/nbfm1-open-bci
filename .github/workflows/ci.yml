name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt

      - name: Python syntax
        run: |
          if find software scripts tests -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m compileall -q software scripts tests
          fi

      - name: Ruff
        run: |
          targets=()
          for d in software scripts tests; do
            [ -e "$d" ] && targets+=("$d")
          done
          if [ ${#targets[@]} -gt 0 ]; then
            ruff check "${targets[@]}"
          fi

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: Fetch canonical license texts for validation
        run: ./scripts/vendor_licenses.sh

      - name: REUSE compliance
        run: reuse lint

      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Tests
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            pytest
          fi
