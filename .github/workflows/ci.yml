name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install numpy cryptography

      - name: Python syntax
        run: python -m compileall -q bin scripts tests hardware/eeg128-tdm

      - name: Ruff
        run: ruff check bin scripts tests hardware/eeg128-tdm

      - name: Pytest
        run: pytest -q

      - name: Zero-debt gate
        run: python scripts/check_zero_debt.py

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: REUSE 3.0 compliance
        run: reuse lint

      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          bash -n deploy_bci_stack.sh

      - name: Release manifest freshness and verification
        run: |
          test -f PUBLICATION_SHA256SUMS
          cp PUBLICATION_SHA256SUMS /tmp/PUBLICATION_SHA256SUMS.committed
          bash scripts/generate_release_manifest.sh
          cmp --silent /tmp/PUBLICATION_SHA256SUMS.committed PUBLICATION_SHA256SUMS || {
            echo "PUBLICATION_SHA256SUMS is stale. Run ./scripts/generate_release_manifest.sh and commit it."
            diff -u /tmp/PUBLICATION_SHA256SUMS.committed PUBLICATION_SHA256SUMS || true
            exit 1
          }
          bash scripts/verify_release_manifest.sh

      - name: KiCad source integrity
        run: python hardware/eeg128-tdm/validate_eda.py

      - name: Generated schematic smoke test
        run: |
          python hardware/eeg128-tdm/generate_schematic.py --output /tmp/eeg128-tdm.generated.kicad_sch
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("/tmp/eeg128-tdm.generated.kicad_sch").read_text(encoding="utf-8")
          instances = len(re.findall(r"(?m)^  \\(symbol$", text))
          wires = len(re.findall(r"(?m)^  \\(wire$", text))
          if instances < 640:
              raise SystemExit(f"generated schematic has too few symbol instances: {instances}")
          if wires < 1000:
              raise SystemExit(f"generated schematic has too few connected pin stubs: {wires}")
          print({"instances": instances, "wires": wires})
          PY
