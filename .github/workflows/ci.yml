name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install numpy cryptography

      - name: Python syntax
        run: python -m compileall -q bin scripts tests

      - name: Ruff
        run: ruff check bin scripts tests

      - name: Pytest
        run: pytest -q

      - name: Zero-debt gate
        run: python scripts/check_zero_debt.py

      - name: Validate CITATION.cff
        run: cffconvert --validate

      - name: REUSE 3.0 compliance
        run: reuse lint

      - name: Shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          bash -n deploy_bci_stack.sh

      - name: Release manifest
        run: ./scripts/verify_release_manifest.sh

      - name: KiCad source sanity
        run: python hardware/eeg128-tdm/validate_eda.py
