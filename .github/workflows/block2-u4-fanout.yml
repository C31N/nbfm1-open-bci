# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 FCu global reachability target escape no-release
on:
  workflow_dispatch:
  push:
    branches: [codex/u4-deterministic-fanout-2026-11-04]
    paths:
      - ".github/workflows/block2-u4-fanout.yml"
      - "hardware/eeg128-tdm/probe_block2_u4_corridors.py"
      - "hardware/eeg128-tdm/probe_block2_u4_dogleg.py"
      - "hardware/eeg128-tdm/probe_block2_u4_topological.py"
      - "hardware/eeg128-tdm/probe_block2_target_escape.py"
      - "hardware/eeg128-tdm/probe_block2_target_coupled.py"
      - "hardware/eeg128-tdm/probe_block2_fcu_reachability.py"
      - "hardware/eeg128-tdm/probe_block2_grid_export.py"
      - "hardware/eeg128-tdm/probe_block2_multinet_cut.py"
      - "hardware/eeg128-tdm/swig_free_fcu_geometry.py"
      - "hardware/eeg128-tdm/test_swig_free_fcu_geometry.py"
      - "hardware/eeg128-tdm/probe_block2_native_fcu_bottleneck.py"
      - "hardware/eeg128-tdm/probe_block2_mutual_reservation.py"
      - "hardware/eeg128-tdm/probe_block2_elastic_joint_corridor.py"
      - "hardware/eeg128-tdm/probe_block2_joint_topology_costs.py"
      - "hardware/eeg128-tdm/probe_block2_hybrid_midpoint.py"
      - "hardware/eeg128-tdm/joint_start_anchor_resolver.py"
      - "hardware/eeg128-tdm/local_joint_rip_reroute.py"
      - "hardware/eeg128-tdm/local_joint_anchor_preflight.py"
      - "hardware/eeg128-tdm/local_joint_astar_partial_free.py"
      - "tests/test_three_net_evasion_generator.py"
      - "hardware/eeg128-tdm/test_local_joint_astar_partial_free.py"
      - "hardware/eeg128-tdm/test_local_joint_anchor_preflight.py"
      - "hardware/eeg128-tdm/test_local_joint_rip_reroute.py"
      - "hardware/eeg128-tdm/test_joint_start_anchor_resolver.py"
      - "hardware/eeg128-tdm/probe_block2_cbs_fcu3.py"
      - "hardware/eeg128-tdm/probe_block2_nbody_201.py"
      - "hardware/eeg128-tdm/test_block2_cbs_fcu3.py"
      - "hardware/eeg128-tdm/test_block2_nbody_201.py"
      - "hardware/eeg128-tdm/test_block2_u4_dogleg.py"
      - "hardware/eeg128-tdm/test_block2_u4_topological.py"
      - "hardware/eeg128-tdm/test_block2_target_escape.py"
      - "hardware/eeg128-tdm/test_block2_target_coupled.py"
      - "hardware/eeg128-tdm/test_block2_fcu_reachability.py"
      - "hardware/eeg128-tdm/test_block2_midpoint_reach.py"
      - "hardware/eeg128-tdm/test_block2_grid_export.py"
      - "hardware/eeg128-tdm/test_block2_multinet_cut.py"
      - "hardware/eeg128-tdm/test_block2_native_fcu_bottleneck.py"
      - "hardware/eeg128-tdm/test_block2_mutual_reservation.py"
      - "hardware/eeg128-tdm/test_block2_elastic_joint_corridor.py"
      - "hardware/eeg128-tdm/test_block2_joint_topology_costs.py"
      - "hardware/eeg128-tdm/test_block2_hybrid_midpoint.py"
permissions:
  contents: read
jobs:
  no-release-fanout:
    strategy:
      fail-fast: false
      matrix:
        order: [0]
        method: [cbs]
    runs-on: ubuntu-24.04
    timeout-minutes: 31
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Pinned KiCad 8.0.9 and native geometry
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy python3-scipy python3-pytest
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Continuous FCu connectivity and immutable escape gates
        run: |
          PYTHONPATH=hardware/eeg128-tdm /usr/bin/python3 -m pytest -q tests/test_partial_free_cost_model.py tests/test_three_net_evasion_generator.py
          /usr/bin/python3 -m py_compile hardware/eeg128-tdm/probe_block2_u4_corridors.py hardware/eeg128-tdm/probe_block2_u4_dogleg.py hardware/eeg128-tdm/probe_block2_u4_topological.py hardware/eeg128-tdm/probe_block2_target_escape.py hardware/eeg128-tdm/probe_block2_target_coupled.py hardware/eeg128-tdm/probe_block2_fcu_reachability.py hardware/eeg128-tdm/probe_block2_grid_export.py hardware/eeg128-tdm/probe_block2_multinet_cut.py hardware/eeg128-tdm/probe_block2_native_fcu_bottleneck.py hardware/eeg128-tdm/swig_free_fcu_geometry.py hardware/eeg128-tdm/probe_block2_mutual_reservation.py hardware/eeg128-tdm/probe_block2_elastic_joint_corridor.py hardware/eeg128-tdm/probe_block2_joint_topology_costs.py hardware/eeg128-tdm/probe_block2_hybrid_midpoint.py hardware/eeg128-tdm/joint_start_anchor_resolver.py hardware/eeg128-tdm/local_joint_rip_reroute.py hardware/eeg128-tdm/local_joint_anchor_preflight.py hardware/eeg128-tdm/local_joint_astar_partial_free.py hardware/eeg128-tdm/probe_block2_cbs_fcu3.py hardware/eeg128-tdm/probe_block2_nbody_201.py
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_cbs_fcu3.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_nbody_201.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_u4_dogleg.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_u4_topological.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_mutual_reservation.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_elastic_joint_corridor.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_joint_topology_costs.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_hybrid_midpoint.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_joint_start_anchor_resolver.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_local_joint_rip_reroute.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_local_joint_anchor_preflight.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_local_joint_astar_partial_free.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_target_escape.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_target_coupled.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_fcu_reachability.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_midpoint_reach.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_grid_export.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_multinet_cut.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_native_fcu_bottleneck.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_swig_free_fcu_geometry.py -v
      - name: Reproduce protected 139 source
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/u4-fanout-source139.json \
            --candidate-output /tmp/u4-fanout-source139.zip
      - name: Native SHAPE_POLY_SET FCu bottleneck read-only measurement
        timeout-minutes: 4
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_native_fcu_bottleneck.py \
            --archive /tmp/u4-fanout-source139.zip \
            --x 48.145 --y 35.750 --window 2.5 \
            --output /tmp/native-fcu-bottleneck.json
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/native-fcu-bottleneck.json').read_text())
          assert d['source_board_unchanged'] is True
          assert d['native_global_three_net_unroutability_proven'] is False
          assert abs(d['design_rules_mm']['three_tracks_wall_to_wall_mm']-1.05)<1e-9
          assert all(d[k] is False for k in (
              'accepted','routing_completed','fabrication_release'))
          print('NATIVE_FCU_BOTTLENECK_SUMMARY='+json.dumps({
              'status':d['status'],
              'native_polygon_count':d['native_polygon_count'],
              'analytic_approximation_count':d['analytic_approximation_count'],
              'swig_free_closed_form_object_count':d['swig_free_closed_form_object_count'],
              'closed_form_pair_count':d['closed_form_pair_count'],
              'native_polygon_closed_form_pair_count':d['native_polygon_closed_form_pair_count'],
              'mixed_or_unqualified_pair_count':d['mixed_or_unqualified_pair_count'],
              'global_joint_three_net_min_cut_proven':d['global_joint_three_net_min_cut_proven'],
              'obstacle_count':d['obstacle_count'],
              'tightest_clear_gap_mm':d['tightest_clear_gap_mm'],
              'max_tracks_strict':d['max_tracks_strict'],
              'narrowest_gaps':d['narrowest_gaps'][:4],
              'warnings':d['native_polygon_warnings'][:4],
          },sort_keys=True))
          PY
      - name: Native hybrid midpoint and gated 201 restitution
        timeout-minutes: 21
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_nbody_201.py \
            --candidate /tmp/u4-fanout-source139.zip \
            --order ${{ matrix.order }} \
            --${{ matrix.method }}-three \
            --u4-fanout \
            --cbs-grid-mm 0.22 \
            --output /tmp/u4-fanout-${{ matrix.method }}-${{ matrix.order }}.json
      - name: Fail closed and require exact 201 UUID inventory
        run: |
          ORDER=${{ matrix.order }} METHOD=${{ matrix.method }} /usr/bin/python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/u4-fanout-'+os.environ['METHOD']+'-'+os.environ['ORDER']+'.json').read_text())
          w=d['child_diagnostic']
          assert d['source_unchanged']
          assert d['child_exit_code']==0, d.get('child_stderr_tail')
          assert w and w['u4_deterministic_fanout_enabled'] is True
          assert w['original_victim_count']==201
          assert len(w['cut_whitelist_UUIDs'])==201
          assert len(w['CH038_cut_UUIDs'])==2
          assert not set(w['cut_whitelist_UUIDs']).intersection(w['CH038_cut_UUIDs'])
          assert d['new_vias_added']==w['new_vias_added']==0
          for k in ('accepted','routing_completed','fabrication_release',
                    'manufacturing_files','checkpoint_promoted',
                    'schematic_parity_qualified','independent_replay_verified'):
              assert d[k] is False and w[k] is False, k
          f=w.get('rubber_guided_CBS3_diagnostic') or w.get('cbs_three_diagnostic')
          if f is not None:
              assert f.get('u4_deterministic_fanout_enabled') is True
              g=f.get('u4_deterministic_fanout_diagnostic')
              if f.get('status')=='CBS3_target_triplet_native_preflight_blocked':
                  assert (
                      'Target_global_FCu_reachability_blocked' in f['reason']
                      or 'Target_coupled_postseal_preflight_blocked' in f['reason']
                      or 'target_triplet' in f['reason'])
                  assert not w['target_nets_routed']
                  assert w['fully_restituted'] is False
              if f.get('status')=='CBS3_midpoint_global_FCu_components_disconnected':
                  assert f['midpoint_polygon_constrained_A_star'] is True
                  assert f['midpoint_all_three_shared_components'] is False
                  assert len(f['midpoint_global_polygon_reachability'])==3
                  assert f['midpoint_native_UUID_cut_witnesses']
                  assert not w['target_nets_routed']
                  assert w['fully_restituted'] is False
              if g and f.get('status') not in (
                  'CBS3_target_triplet_native_preflight_blocked',
                  'CBS3_midpoint_global_FCu_components_disconnected',
              ):
                  assert g['tip_pitch_mm']==0.300
                  assert g['U3_pad7_UUID']=='e37256fc-3b9f-435d-8042-f7d4c1147aca'
                  assert g['minimum_centerline_mm']>=0.300-1e-8
                  assert g['fixed_copper_unchanged'] is True
                  assert g['status']=='topological_U4_three_FCu_escape_proposed'
                  assert len(g['goal_lane_mm'])==3
                  assert g['total_a_star_nodes']>0
                  assert g['parallel_length_mm']>=1.5
                  assert g['native_obstacle_preflight_passed'] is True
                  assert len(g['CH027_protected_UUIDs'])==2
                  assert f['post_fanout_split_mode']=='elastic-joint-edt'
                  assert f['macro_global_detour_window'] is True
                  assert f['uuid_detour_reach_mm']==12.0
                  assert f['u4_local_escape_guard_radius_mm']==3.0
                  assert f['grid_export_is_no_release_diagnostic_only'] is True
                  assert f['macro_search_grid_export']['format']=='F_Cu_macro_grid_3nets_diagnostic_v1'
                  assert f['macro_search_grid_export']['accepted'] is False
                  assert f['optimistic_three_net_FCu_capacity']['new_vias_added']==0
                  assert f['optimistic_three_net_FCu_capacity']['optimistic_max_vertex_disjoint_paths']<=3
                  assert f['optimistic_three_net_FCu_capacity_relaxed_diagonals']['native_continuous_FCu_impossibility_proven'] is False
                  assert f['midpoint_polygon_constrained_A_star'] is True
                  assert f['midpoint_all_three_shared_components'] is True
                  if f.get('macro_future_hard_reservation_radius_mm') is not None:
                      assert f['macro_future_hard_reservation_radius_mm']==[.300,.420]
                      assert f['macro_history_alternative_buffer_mm']==.62
                  assert len(f['midpoint_global_polygon_reachability'])==3
                  assert all(q['shared_component'] and
                      q['global_FCu_polygon_gate_applied'] and
                      q['reachable_grid_nodes']>0
                      for q in f['midpoint_global_polygon_reachability'])
                  result=f.get('post_escape_mutual_reservation')
                  joint=f.get('elastic_joint_corridor_diagnostic')
                  assert result and result['locked_U4_escape_count']==3
                  assert result['locked_target_escape_count']==3
                  assert result['new_vias_added']==0
                  assert result['native_DRC_still_required'] is True
                  assert joint
                  assert joint['closed_nets'] in (0,3)
                  assert joint['new_vias_added']==0
                  assert joint['accepted'] is False
                  assert joint['routing_completed'] is False
                  assert joint['fabrication_release'] is False
                  assert joint['native_DRC_still_required'] is True
                  assert joint['hard_centreline_pitch_mm']==.300
                  assert f['hybrid_corridor_diagnostic']['stage_used'] in (
                      'sequential','local_rip_reroute',
                      'local_joint_astar','failed')
                  assert f['local_joint_expansions']>=0
                  assert f['stage_used'] in (
                      'sequential','local_rip_reroute',
                      'local_joint_astar','global_joint_fallback')
                  assert f['topological_ordering_mode']=='soft_unless_monotone_certified'
                  assert f['wall_hugging_clearance_source']=='native_prebuffered_copper'
                  assert f['midpoint_band_max_gap_mm']==.50
                  assert f['combined_immutable_escape_sha256']==f['elastic_joint_corridor_sha256_after']
                  if joint['status']=='MIDPOINT_BUNDLE_SOLVED':
                      assert joint['closed_nets']==3
                      assert f['post_escape_macros_all_reserved'] is True
                      assert result['simultaneous_routed_nets']==3
                      assert joint['minimum_complete_centreline_mm']>=.300-1e-8
                  else:
                      assert joint['closed_nets']==0
                      assert not w['target_nets_routed']
                      assert not w['fully_restituted']
                  assert f['u4_immutable_fanout_sha256']==f['u4_fanout_sha256_after_macro']
                  t=f.get('target_triplet_deterministic_escape_diagnostic')
                  assert t and t['status']=='three_native_target_escapes_preflighted_not_DRC'
                  assert len(t['target_pad_UUIDs'])==3
                  assert len(set(t['target_pad_UUIDs']))==3
                  assert t['hard_centreline_clearance_mm']==.300
                  assert t['target_lane_consolidation_required'] is False
                  assert t['minimum_target_centerline_mm']>=.300-1e-8
                  assert t['no_new_vias'] is True
                  assert t['fixed_copper_unchanged'] is True
                  assert t['all_target_tips_same_component_as_U4'] is True
                  assert t['all_three_connected_after_target_seal'] is True
                  assert t['search']['postseal_continuous_components_verified'] is True
                  assert t['search']['postseal_component_evaluations']>=1
                  assert t['search']['partial_reservation_evaluations']>=3
                  assert t['global_FCu_reachability']['all_three_reachable'] is True
                  assert all(x['shared_component'] for x in t['global_FCu_reachability']['per_agent'])
                  assert f['target_immutable_escape_sha256']==f['target_escape_sha256_after_macro']
                  assert t['target_escape_immutable_sha256']==f['target_immutable_escape_sha256']
                  assert result['locked_target_escape_count']==3
                  if result['status']=='joint_bundle_three_macros_proposed_unverified':
                      assert f['post_escape_macros_all_reserved'] is True
                      assert result['minimum_post_escape_centreline_mm']>=.300-1e-8
                      assert f['u4_full_fanout_vertices_retained']==[
                          len(wire) for wire in g['fanout_paths_mm']]
                      assert f['target_full_escape_vertices_retained']==[
                          len(wire) for wire in t['target_escape_paths_mm']]
          assert not set(w['victims_restored_original_geometry']).intersection(
              w['victims_routed_new_geometry'])
          if d['candidate_qualified_136']:
              assert d['candidate_native_DRC']=={
                  'violations':0,'warnings':0,'unconnected':136}
              assert w['fully_restituted'] is True
              assert len(w['victims_restored_original_geometry'])+len(
                  w['victims_routed_new_geometry'])==201
          hybrid=f.get('hybrid_corridor_diagnostic') if f else None
          if hybrid:
              audit=hybrid.get('local_joint_anchor_audit') or {}
              multi={
                  'status':hybrid.get('local_joint_status'),
                  'eligible_anchor_pairs':hybrid.get('multi_anchor_eligible_count',0),
                  'attempted_anchor_pairs':audit.get('attempted_anchor_pairs',0),
                  'candidate_details':[{
                      'ordinal':a.get('ordinal'),
                      'source_indices':a.get('source_indices'),
                      'target_indices':a.get('target_indices'),
                      'start_pitch_mm':a.get('start_pitch_mm'),
                      'target_pitch_mm':a.get('target_pitch_mm'),
                      'status':a.get('status'),
                      'expansions':a.get('expansions'),
                      'first_step_rejections':(a.get('first_step') or {}).get('reject_reasons',{}),
                  } for a in audit.get('attempts',[])],
                  'local_joint_expansions':hybrid.get('local_joint_expansions'),
                  'joint_search_rejections':hybrid.get('local_joint_reject_reasons'),
                  'restored_count':len(w.get('victims_restored_original_geometry',[])),
                  'rerouted_count':len(w.get('victims_routed_new_geometry',[])),
                  'all_three_closed':bool(w.get('target_nets_routed')),
                  'accepted':False,
                  'fabrication_release':False,
              }
              assert audit.get('locked_escape_ripup_permitted') is not True
              assert hybrid.get('new_vias_added')==0
              partial=hybrid.get('partial_free_diagnostic') or {}
              if partial:
                  assert partial['initial_heads']==[None,None,None]
                  assert partial['new_vias_added']==0
                  assert partial['accepted'] is False
                  assert partial['routing_completed'] is False
                  assert partial['fabrication_release'] is False
                  assert partial['expansions']<=2400
                  assert (partial['third_binding_roots_with_goal_progress']
                          <=partial['third_binding_survived_after_one_step']
                          <=partial['third_binding_admitted'])
                  assert 0.<=partial['third_binding_goal_progress_rate']<=1.
                  assert partial['search_states_by_bound_count'][0]>=1
                  print('PARTIAL_FREE_SUMMARY='+json.dumps({
                      'status':partial['status'],
                      'expansions':partial['expansions'],
                      'state_counts':partial['search_states_by_bound_count'],
                      'moves_while_unbound':partial['moves_while_other_nets_unbound'],
                      'bindings_examined':partial['binding_actions_examined'],
                      'bindings_valid':partial['binding_actions_valid'],
                      'third_bindings_attempted':partial['third_binding_transition_attempts'],
                      'third_bindings_native_valid':partial['third_binding_native_valid'],
                      'third_bindings_admitted':partial['third_binding_admitted'],
                      'third_binding_expanded_roots':partial['third_binding_expanded_roots'],
                      'third_binding_survived_after_one_step':partial['third_binding_survived_after_one_step'],
                      'third_binding_survival_rate':partial['third_binding_survival_rate'],
                      'third_binding_roots_with_goal_progress':partial['third_binding_roots_with_goal_progress'],
                      'third_binding_goal_progress_rate':partial['third_binding_goal_progress_rate'],
                      'third_binding_best_goal_progress_mm':partial['third_binding_best_goal_progress_mm'],
                      'third_binding_max_targets_reached':partial['third_binding_max_targets_reached'],
                      'average_progress_sync_penalty':partial['average_progress_sync_penalty'],
                      'average_progress_sync_penalty_after_third_binding':partial['average_progress_sync_penalty_after_third_binding'],
                      'rejections_by_bound_count':partial['rejections_by_bound_count'],
                      'three_net_evasion_stages_generated':partial['three_net_evasion_stages_generated'],
                      'three_net_evasion_stages_admitted':partial['three_net_evasion_stages_admitted'],
                      'three_net_evasion_stages_expanded':partial['three_net_evasion_stages_expanded'],
                      'three_net_evasion_fair_queue_pop_count':partial['three_net_evasion_fair_queue_pop_count'],
                      'three_net_evasion_fair_queue_stale_pops':partial['three_net_evasion_fair_queue_stale_pops'],
                      'three_net_evasion_fair_queue_peak':partial['three_net_evasion_fair_queue_peak'],
                      'three_net_evasion_first_admitted_expansion':partial['three_net_evasion_first_admitted_expansion'],
                      'three_net_evasion_first_expanded_expansion':partial['three_net_evasion_first_expanded_expansion'],
                      'three_net_evasion_first_wait_expansions':partial['three_net_evasion_first_wait_expansions'],
                      'three_net_evasion_average_expansion_ms':partial['three_net_evasion_average_expansion_ms'],
                      'three_net_evasion_max_expansion_ms':partial['three_net_evasion_max_expansion_ms'],
                      'three_net_evasion_first_expanded_probe':partial['three_net_evasion_first_expanded_probe'],
