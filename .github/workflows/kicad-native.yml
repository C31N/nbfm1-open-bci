name: Native KiCad 8 Validation

on:
  push:
  pull_request:
    paths:
      - ".github/workflows/kicad-native.yml"
      - "hardware/eeg128-tdm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kicad8:
    runs-on: ubuntu-24.04
    env:
      KICAD_ENABLE_WXTRACE: "1"
      WXTRACE: "KICAD_SCH_PLUGIN,KICAD_SCH_SHEET_PATHS"

    steps:
      - uses: actions/checkout@v7

      - name: Install KiCad 8
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          kicad-cli version
          kicad-cli version | grep -E '^8\.'

      - name: Parse primary connectivity-index schematic
        run: |
          mkdir -p /tmp/kicad-audit
          kicad-cli sch export netlist \
            --format kicadsexpr \
            --output /tmp/kicad-audit/primary.net \
            hardware/eeg128-tdm/eeg128-tdm.kicad_sch
          test -s /tmp/kicad-audit/primary.net

      - name: Generate current connectivity schematic
        run: |
          python3 hardware/eeg128-tdm/generate_schematic.py \
            --output /tmp/kicad-audit/eeg128-tdm.generated.kicad_sch
          cp hardware/eeg128-tdm/sym-lib-table /tmp/kicad-audit/sym-lib-table
          cp hardware/eeg128-tdm/NBFM1_A0.kicad_sym /tmp/kicad-audit/NBFM1_A0.kicad_sym
          test -s /tmp/kicad-audit/eeg128-tdm.generated.kicad_sch

      - name: Parse generated schematic and export native netlist
        run: |
          kicad-cli sch export netlist \
            --format kicadsexpr \
            --output /tmp/kicad-audit/eeg128-tdm.net \
            /tmp/kicad-audit/eeg128-tdm.generated.kicad_sch
          test -s /tmp/kicad-audit/eeg128-tdm.net

      - name: Run schematic ERC report
        run: |
          kicad-cli sch erc \
            --format json \
            --severity-all \
            --output /tmp/kicad-audit/erc.json \
            hardware/eeg128-tdm/eeg128-tdm.kicad_sch
          test -s /tmp/kicad-audit/erc.json

      - name: Summarize ERC
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/kicad-audit/erc.json").read_text(encoding="utf-8")
          )
          violations = [
              item
              for sheet in report.get("sheets", [])
              for item in sheet.get("violations", [])
          ]
          counts = {
              severity: sum(
                  1 for item in violations if item.get("severity") == severity
              )
              for severity in ("error", "warning", "info")
          }
          summary = {"total": len(violations), **counts}
          print(summary)
          Path("/tmp/kicad-audit/erc-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          if counts["error"]:
              raise SystemExit(f"schematic ERC contains {counts['error']} error(s)")
          PY

      - name: Parse PCB and run DRC report
        run: |
          kicad-cli pcb drc             --format json             --severity-all             --all-track-errors             --output /tmp/kicad-audit/drc.json             hardware/eeg128-tdm/eeg128-tdm.kicad_pcb
          test -s /tmp/kicad-audit/drc.json

      - name: Summarize PCB DRC
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/kicad-audit/drc.json").read_text(encoding="utf-8")
          )
          violations = report.get("violations", [])
          counts = {
              severity: sum(
                  1 for item in violations if item.get("severity") == severity
              )
              for severity in ("error", "warning", "info")
          }
          summary = {
              "violations_total": len(violations),
              **counts,
              "unconnected_items": len(report.get("unconnected_items", [])),
              "schematic_parity_items": len(report.get("schematic_parity", [])),
          }
          print(summary)
          Path("/tmp/kicad-audit/drc-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify PCB placement export parses
        run: |
          kicad-cli pcb export pos             --format csv             --units mm             --side both             --smd-only             --exclude-dnp             --output /tmp/kicad-audit/placement.csv             hardware/eeg128-tdm/eeg128-tdm.kicad_pcb
          test -s /tmp/kicad-audit/placement.csv
          grep -q '"U21"' /tmp/kicad-audit/placement.csv || grep -q '^U21,' /tmp/kicad-audit/placement.csv

      - name: Confirm release remains fail closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("hardware/eeg128-tdm/RELEASE_STATUS.json").read_text(encoding="utf-8")
          )
          forbidden = (
              "fabrication_release",
              "human_connected_use_authorized",
              "routing_completed",
              "drc_passed",
              "schematic_parity_passed",
          )
          wrongly_enabled = [key for key in forbidden if bool(status.get(key))]
          if wrongly_enabled:
              raise SystemExit(
                  "A0 release gate unexpectedly enabled: " + ", ".join(wrongly_enabled)
              )
          print("A0 remains intentionally blocked for fabrication/human connection")
          PY

      - name: Upload native KiCad audit reports
        uses: actions/upload-artifact@v6
        with:
          name: kicad8-audit
          path: |
            /tmp/kicad-audit/primary.net
            /tmp/kicad-audit/eeg128-tdm.net
            /tmp/kicad-audit/erc.json
            /tmp/kicad-audit/erc-summary.json
            /tmp/kicad-audit/drc.json
            /tmp/kicad-audit/drc-summary.json
            /tmp/kicad-audit/placement.csv
          if-no-files-found: error
          retention-days: 30
