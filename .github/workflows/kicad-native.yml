name: Native KiCad 8 Validation

on:
  push:
  pull_request:
    paths:
      - ".github/workflows/kicad-native.yml"
      - "hardware/eeg128-tdm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kicad8:
    runs-on: ubuntu-24.04
    env:
      KICAD_ENABLE_WXTRACE: "1"
      WXTRACE: "KICAD_SCH_PLUGIN,KICAD_SCH_SHEET_PATHS"

    steps:
      - uses: actions/checkout@v7

      - name: Install KiCad 8
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad python3-numpy python3-shapely
          kicad-cli version
          kicad-cli version | grep -E '^8\.'

      - name: Parse primary connectivity-index schematic
        run: |
          mkdir -p /tmp/kicad-audit
          kicad-cli sch export netlist \
            --format kicadsexpr \
            --output /tmp/kicad-audit/primary.net \
            hardware/eeg128-tdm/eeg128-tdm.kicad_sch
          test -s /tmp/kicad-audit/primary.net

      - name: Generate current connectivity schematic
        run: |
          python3 hardware/eeg128-tdm/generate_schematic.py \
            --output /tmp/kicad-audit/eeg128-tdm.generated.kicad_sch
          cp hardware/eeg128-tdm/sym-lib-table /tmp/kicad-audit/sym-lib-table
          cp hardware/eeg128-tdm/NBFM1_A0.kicad_sym /tmp/kicad-audit/NBFM1_A0.kicad_sym
          test -s /tmp/kicad-audit/eeg128-tdm.generated.kicad_sch

      - name: Parse generated schematic and export native netlist
        run: |
          kicad-cli sch export netlist \
            --format kicadsexpr \
            --output /tmp/kicad-audit/eeg128-tdm.net \
            /tmp/kicad-audit/eeg128-tdm.generated.kicad_sch
          test -s /tmp/kicad-audit/eeg128-tdm.net

      - name: Run schematic ERC report
        run: |
          kicad-cli sch erc \
            --format json \
            --severity-all \
            --output /tmp/kicad-audit/erc.json \
            hardware/eeg128-tdm/eeg128-tdm.kicad_sch
          test -s /tmp/kicad-audit/erc.json

      - name: Summarize ERC
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/kicad-audit/erc.json").read_text(encoding="utf-8")
          )
          violations = [
              item
              for sheet in report.get("sheets", [])
              for item in sheet.get("violations", [])
          ]
          counts = {
              severity: sum(
                  1 for item in violations if item.get("severity") == severity
              )
              for severity in ("error", "warning", "info")
          }
          summary = {"total": len(violations), **counts}
          print(summary)
          Path("/tmp/kicad-audit/erc-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          if counts["error"]:
              raise SystemExit(f"schematic ERC contains {counts['error']} error(s)")
          PY

      - name: Parse PCB and run DRC report
        run: |
          kicad-cli pcb drc             --format json             --severity-all             --all-track-errors             --output /tmp/kicad-audit/drc.json             hardware/eeg128-tdm/eeg128-tdm.kicad_pcb
          test -s /tmp/kicad-audit/drc.json

      - name: Summarize PCB DRC
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/kicad-audit/drc.json").read_text(encoding="utf-8")
          )
          violations = report.get("violations", [])
          counts = {
              severity: sum(
                  1 for item in violations if item.get("severity") == severity
              )
              for severity in ("error", "warning", "info")
          }
          summary = {
              "violations_total": len(violations),
              **counts,
              "unconnected_items": len(report.get("unconnected_items", [])),
              "schematic_parity_items": len(report.get("schematic_parity", [])),
          }
          print(summary)
          Path("/tmp/kicad-audit/drc-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          status = json.loads(
              Path("hardware/eeg128-tdm/RELEASE_STATUS.json").read_text(encoding="utf-8")
          )
          if status.get("a2_preroute"):
              if violations or counts["warning"]:
                  raise SystemExit("Primary pre-route PCB regressed: " + json.dumps(summary))
              print("Primary pre-route geometry gate PASS; connectivity remains blocked")
          PY

      - name: Test board-outline routing domains and cutouts
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_routing_layer_constraints.py -v

      - name: Test reviewed neighbor replay guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch018_neighbor_replay.py -v

      - name: Replay reviewed CH018-N engineering closure
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_ch018_neighbors.py \
            --output-dir /tmp/ch018-reviewed-replay

      - name: Test reviewed CH029 electrode replay guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch029_electrode_replay.py -v

      - name: Replay reviewed CH029 electrode engineering closure
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_ch029_electrode.py \
            --output-dir /tmp/ch029-reviewed-replay

      - name: Test reviewed CH025 electrode replay guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_electrode_replay.py -v

      - name: Replay reviewed CH025 electrode engineering closure
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_ch025_electrode.py \
            --output-dir /tmp/ch025-reviewed-replay

      - name: Test reviewed joint electrode replay guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch019_electrode_replay.py -v

      - name: Replay reviewed joint CH017-CH019 electrode engineering closure
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_ch019_electrode.py \
            --output-dir /tmp/ch019-reviewed-replay

      - name: Test unadopted 139-airwire escape probe guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_escape139_probes.py -v

      - name: Replay unadopted preparatory escape probes without promotion
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_escape139_probes.py \
            --case c22 --output-dir /tmp/escape139-c22-probe
          /usr/bin/python3 hardware/eeg128-tdm/replay_escape139_probes.py \
            --case c26 --output-dir /tmp/escape139-c26-probe

      - name: Test unadopted 139 escape diagnostic guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_139_escape_diagnostic.py -v

      - name: Replay unadopted 139 escape diagnostic
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_139_escape_diagnostic.py \
            --output-dir /tmp/escape139-unadopted-replay

      - name: Test control-window and header-dogleg replay guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_controls_header139.py -v

      - name: Replay unadopted control window and header doglegs
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_controls_header139.py \
            --case controls --output-dir /tmp/controls139-unadopted
          /usr/bin/python3 hardware/eeg128-tdm/replay_controls_header139.py \
            --case header --output-dir /tmp/header139-unadopted

      - name: Test unadopted CH030 probe replay guards
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch030_probe_replay.py -v

      - name: Replay unadopted CH030 diagnostic without promoting the checkpoint
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/replay_ch030_probe.py \
            --output-dir /tmp/ch030-unadopted-probe

      - name: Confirm diagnostic audit contains no manufacturing exports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audits = [Path("/tmp/kicad-audit"), Path("/tmp/ch018-reviewed-replay"), Path("/tmp/ch029-reviewed-replay"), Path("/tmp/ch025-reviewed-replay"), Path("/tmp/ch030-unadopted-probe"), Path("/tmp/ch019-reviewed-replay"), Path("/tmp/escape139-c22-probe"), Path("/tmp/escape139-c26-probe"), Path("/tmp/escape139-unadopted-replay"), Path("/tmp/controls139-unadopted"), Path("/tmp/header139-unadopted")]
          forbidden_suffixes = {".gbr", ".gerber", ".drl", ".pos"}
          forbidden_names = {"placement.csv", "bom.csv", "cpl.csv"}
          exports = [
              str(path) for audit in audits for path in audit.rglob("*")
              if path.is_file() and (
                  path.suffix.lower() in forbidden_suffixes
                  or path.name.lower() in forbidden_names
              )
          ]
          if exports:
              raise SystemExit("Unexpected manufacturing exports: " + ", ".join(exports))
          print("Diagnostic audit only; manufacturing export is disabled")
          PY

      - name: Confirm release remains fail closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("hardware/eeg128-tdm/RELEASE_STATUS.json").read_text(encoding="utf-8")
          )
          forbidden = (
              "fabrication_release",
              "human_connected_use_authorized",
              "routing_completed",
              "drc_passed",
              "schematic_parity_passed",
          )
          wrongly_enabled = [key for key in forbidden if bool(status.get(key))]
          if wrongly_enabled:
              raise SystemExit(
                  "A0 release gate unexpectedly enabled: " + ", ".join(wrongly_enabled)
              )
          print("A0 remains intentionally blocked for fabrication/human connection")
          PY

      - name: Upload native KiCad audit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kicad8-audit
          path: |
            /tmp/kicad-audit/primary.net
            /tmp/kicad-audit/eeg128-tdm.net
            /tmp/kicad-audit/erc.json
            /tmp/kicad-audit/erc-summary.json
            /tmp/kicad-audit/drc.json
            /tmp/kicad-audit/drc-summary.json
            /tmp/ch018-reviewed-replay/drc-before.json
            /tmp/ch018-reviewed-replay/drc-after.json
            /tmp/ch018-reviewed-replay/parity.json
            /tmp/ch018-reviewed-replay/result.json
            /tmp/ch029-reviewed-replay/drc-before.json
            /tmp/ch029-reviewed-replay/drc-after.json
            /tmp/ch029-reviewed-replay/parity.json
            /tmp/ch029-reviewed-replay/result.json
            /tmp/ch025-reviewed-replay/drc-before.json
            /tmp/ch025-reviewed-replay/drc-after.json
            /tmp/ch025-reviewed-replay/parity.json
            /tmp/ch025-reviewed-replay/result.json
            /tmp/ch030-unadopted-probe/drc-before.json
            /tmp/ch030-unadopted-probe/drc-after.json
            /tmp/ch030-unadopted-probe/parity.json
            /tmp/ch030-unadopted-probe/result.json
            /tmp/ch019-reviewed-replay/drc-before.json
            /tmp/ch019-reviewed-replay/drc-after.json
            /tmp/ch019-reviewed-replay/parity.json
            /tmp/ch019-reviewed-replay/result.json
            /tmp/escape139-c22-probe/drc-before.json
            /tmp/escape139-c22-probe/drc-after.json
            /tmp/escape139-c22-probe/parity.json
            /tmp/escape139-c22-probe/result.json
            /tmp/escape139-c26-probe/drc-before.json
            /tmp/escape139-c26-probe/drc-after.json
            /tmp/escape139-c26-probe/parity.json
            /tmp/escape139-c26-probe/result.json

            /tmp/escape139-unadopted-replay/drc-before.json
            /tmp/escape139-unadopted-replay/drc-after.json
            /tmp/escape139-unadopted-replay/parity.json
            /tmp/escape139-unadopted-replay/result.json
            /tmp/controls139-unadopted/drc-before.json
            /tmp/controls139-unadopted/drc-after.json
            /tmp/controls139-unadopted/parity.json
            /tmp/controls139-unadopted/result.json
            /tmp/header139-unadopted/drc-before.json
            /tmp/header139-unadopted/drc-after.json
            /tmp/header139-unadopted/parity.json
            /tmp/header139-unadopted/result.json
          if-no-files-found: error
          retention-days: 30
