# SPDX-License-Identifier: AGPL-3.0-only
name: CH027 fixed endpoint exact power clearance
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/ch027-exact-power-endpoints.yml"
      - "hardware/eeg128-tdm/probe_ch027_exact_power_endpoints.py"
      - "hardware/eeg128-tdm/test_ch027_exact_power_endpoints.py"
permissions:
  contents: read
jobs:
  native-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Verify native KiCad 8.0.9
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew, shapely; assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Fail-closed clearance unit tests
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch027_exact_power_endpoints.py -v
      - name: Native exact 3V3A clearance on immutable 139 PCB
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch027_exact_power_endpoints.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/ch027-exact-power-endpoint.json
      - name: Ensure no release or manufacturing
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/ch027-exact-power-endpoint.json").read_text())
          assert d["baseline_airwires"] == 139 and d["target_airwires"] == 136
          for key in ("accepted","fabrication_release","routing_completed",
                      "manufacturing_files","independent_replay_verified",
                      "source_pcb_modified","manufacturing_export_invoked",
                      "native_DRC_run"):
              assert d[key] is False, key
          assert not list(Path("/tmp").rglob("*.gbr"))
          assert not list(Path("/tmp").rglob("*.drl"))
          print(d["fixed_endpoints_meet_required_505_power_clearance"])
          PY
      - name: Upload endpoint JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch027-exact-power-endpoint-native
          path: /tmp/ch027-exact-power-endpoint.json
          if-no-files-found: ignore
