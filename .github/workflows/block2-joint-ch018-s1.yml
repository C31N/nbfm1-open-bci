# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 joint-state Astar CH018P MUXS1 no-release
on:
  workflow_dispatch:
  push:
    branches: [codex/block2-predictive-restitution-2026-10-30]
    paths:
      - ".github/workflows/block2-joint-ch018-s1.yml"
      - "hardware/eeg128-tdm/probe_block2_joint_ch018_s1.py"
      - "hardware/eeg128-tdm/test_block2_joint_ch018_s1.py"
permissions:
  contents: read
jobs:
  ch038-restitution:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native KiCad geometry dependencies
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Verify CH038 exact UUID and no-release constraints
        run: |
          /usr/bin/python3 -m py_compile hardware/eeg128-tdm/probe_block2_joint_ch018_s1.py
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_joint_ch018_s1.py -v
      - name: Reproduce pinned 139 MUX_EN source
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH038-pinned-base.json \
            --candidate-output /tmp/CH038-pinned-base.zip
      - name: Joint Astar on CH018P and MUXS1 with independent native verification
        timeout-minutes: 11
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_joint_ch018_s1.py \
            --candidate /tmp/CH038-pinned-base.zip \
            --grid-mm 0.22 \
            --output /tmp/joint-CH018P-MUXS1.json
      - name: Verify no-release and protected source gates
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/joint-CH018P-MUXS1.json').read_text())
          assert d['source_archive_unchanged']
          assert d['grid_mm']==0.22
          assert d['native_baseline_DRC']=={'violations':0,'warnings':0,'unconnected':139}
          w=d['child_diagnostic']
          assert w is not None
          assert w['grid_mm']==0.22
          assert w['S1_removed_UUID']=='2ac3aecb-9a62-4bc7-846a-75a782ad0474'
          assert w['S2_S3_original_copper_immutable'] is True
          for key in ('accepted','routing_completed','fabrication_release',
                      'manufacturing_files','checkpoint_promoted',
                      'schematic_parity_qualified','independent_replay_verified'):
              assert d[key] is False and w[key] is False, key
          assert d['new_vias_added']==0 and w['new_vias_added']==0
          if d['joint_138_DRC_qualified']:
              assert d['native_trial_DRC']=={'violations':0,'warnings':0,'unconnected':138}
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Publish only no-release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Block2-joint-Astar-CH018P-MUXS1
          path: /tmp/joint-CH018P-MUXS1.json
          if-no-files-found: ignore
