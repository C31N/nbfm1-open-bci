# SPDX-License-Identifier: AGPL-3.0-only
name: Native CH027 wide FCu detour original S0 intact
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/ch027-wide-fcu-untouched-s0.yml"
      - "hardware/eeg128-tdm/probe_ch027_wide_fcu_untouched_s0.py"
      - "hardware/eeg128-tdm/test_ch027_wide_fcu_untouched_s0.py"
permissions:
  contents: read
jobs:
  wide-detour:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned native KiCad 8.0.9
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew,shapely;assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Static untouched S0 no-release safety
        run: |
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch027_wide_fcu_untouched_s0.py -v
      - name: Recreate MUX_EN CH019 pinned 139 input
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/CH027-wide-base.json \
            --candidate-output /tmp/CH027-wide-base.zip
      - name: Native wide FCu detour with S0 original intact
        timeout-minutes: 11
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch027_wide_fcu_untouched_s0.py \
            --candidate /tmp/CH027-wide-base.zip \
            --output /tmp/CH027-wide-original-S0.json
      - name: Fail closed protected original and no release
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/CH027-wide-original-S0.json').read_text())
          assert d['source_archive_unchanged']
          assert d['native_139_baseline']=={'violations':0,'warnings':0,'unconnected':139}
          assert d['both_original_S0_tracks_untouched']
          assert d['protected_originals_unchanged']
          assert d['new_via_count']==0
          for key in ('accepted','fabrication_release','routing_completed',
                      'manufacturing_files','checkpoint_promoted','In1_Cu_used'):
              assert d[key] is False, key
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Publish diagnostic JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CH027-wide-FCu-untouched-S0-native
          path: /tmp/CH027-wide-original-S0.json
          if-no-files-found: ignore
