# SPDX-License-Identifier: CERN-OHL-S-2.0
name: CH025 F.Cu strict L3 joint diagnostic
on:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/ch025-fcu-l3-exact.yml"
      - "hardware/eeg128-tdm/probe_ch025_fcu_l3_exact.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fcu-l3:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned KiCad and native dependencies
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-numpy python3-shapely python3-pip
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew,shapely; assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Verify diagnostic safety policy
        run: /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_ch025_fcu_l3_exact.py -v
      - name: Native F.Cu-only CH025 plus CH022 and strict L3 mask
        timeout-minutes: 36
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_ch025_fcu_l3_exact.py \
            --board hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/ch025-fcu-l3-report.json
      - name: Confirm no release or manufacturing promotion
        if: always()
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          file=Path("/tmp/ch025-fcu-l3-report.json")
          assert file.is_file(), "Missing diagnostic report"
          data=json.loads(file.read_text())
          for key in ("accepted","routing_completed","fabrication_release","manufacturing_files","checkpoint_promoted"):
              assert data[key] is False, key
          assert not list(Path("/tmp").rglob("*.gbr"))
          assert not list(Path("/tmp").rglob("*.drl"))
          print(data["status"])
          PY
      - name: Upload JSON-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch025-fcu-l3-strict-diagnostic
          path: /tmp/ch025-fcu-l3-report.json
          if-no-files-found: ignore
