# SPDX-License-Identifier: CERN-OHL-S-2.0
name: CH022 native pinned KiCad Docker fallback diagnostic
on:
  push:
    branches: [codex/ch039-bcu-virtual-cut-2026-10-21]
    paths:
      - ".github/workflows/ch022-docker-fallback.yml"
      - ".github/workflows/ch022-agnd-layer-hop.yml"
      - "hardware/eeg128-tdm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-kicad8:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        radius: ["0.35", "0.65"]
    steps:
      - uses: actions/checkout@v4
      - name: Run strictly pinned official KiCad Docker image without Launchpad PPA
        timeout-minutes: 60
        run: |
          docker pull kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
          docker run --rm --user 0:0 --network bridge \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/diagnostic:rw" \
            -w /workspace --entrypoint /bin/sh \
            -e RADIUS="${{ matrix.radius }}" \
            kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2 -ec '
              set -eu
              test "$(kicad-cli version)" = "8.0.9"
              /usr/bin/python3 -c "import pcbnew; assert pcbnew.Version().startswith(\"8.0.9\")"
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-shapely python3-numpy python3-pip
              /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
              /usr/bin/python3 -c "import pcbnew, shapely; assert shapely.__version__ == \"2.1.2\"; print(pcbnew.Version(),shapely.__version__)"
              /usr/bin/python3 hardware/eeg128-tdm/probe_block2_r302_joint.py \
                --archive hardware/eeg128-tdm/engineering/followup-2026-10-16-mux137/joint-unadopted137.zip \
                --joint-order interleave --ch022-root R302.1 \
                --reserve-radius "$RADIUS" \
                --ch022-via-plan --ch026-escape-cut --ch026-restore-early \
                --ch017-local-restore --ch022-bcu-inventory --ch022-in2-bypass \
                --output "/diagnostic/ch022-docker-$RADIUS.json"
              /usr/bin/python3 -c "import json,os;d=json.load(open(\"/diagnostic/ch022-docker-\"+os.environ[\"RADIUS\"]+\".json\")); assert d.get(\"accepted\") is False and d.get(\"fabrication_release\") is False and d.get(\"routing_completed\") is False; assert d.get(\"status\") != \"diagnostic_exception\",d.get(\"detail\")"
            '
      - name: Preserve JSON-only diagnosis; never upload PCBs or fabrication exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch022-pinned-docker-radius-${{ matrix.radius }}
          path: ${{ runner.temp }}/ch022-docker-${{ matrix.radius }}.json
          if-no-files-found: ignore
