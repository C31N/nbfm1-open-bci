# SPDX-License-Identifier: AGPL-3.0-only
name: Native MUX EN multihop remaining FCu integration survey
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/mux-en-multihop-neighbors.yml"
      - "hardware/eeg128-tdm/probe_mux_en_multihop_neighbors.py"
permissions:
  contents: read
jobs:
  neighbors:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Pin KiCad and Shapely
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Replay SHA-reviewed MUX_EN and CH019 engineering source
        timeout-minutes: 9
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/route.json \
            --candidate-output /tmp/mux-en-source-only.zip
      - name: Read-only native five-net FCu candidate feasibility
        timeout-minutes: 12
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_neighbors.py \
            --candidate /tmp/mux-en-source-only.zip \
            --output /tmp/mux-en-neighbor-fcu-audit.json
      - name: Assert protection and no manufacturing exports
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/mux-en-neighbor-fcu-audit.json').read_text())
          assert d['original_candidate_archive_untouched']
          assert d['protected_originals_restituted']
          assert d['S2_S3_originals_preserved']
          assert len(d['remaining_mux_fcu_trials'])==5
          for k in ('accepted','routing_completed','fabrication_release',
                    'manufacturing_files','full_136_gate_qualified',
                    'schematic_parity_qualified','In1_Cu_used'):
              assert d[k] is False, k
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Upload analysis only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mux-en-remaining-fcu-native-audit
          path: /tmp/mux-en-neighbor-fcu-audit.json
          if-no-files-found: ignore
