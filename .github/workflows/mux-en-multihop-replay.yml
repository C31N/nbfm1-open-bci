# SPDX-License-Identifier: AGPL-3.0-only
name: Native MUX EN independent source replay audit
on:
  workflow_dispatch:
  push:
    branches: [codex/ch025-fcu-l3-exact-2026-10-21]
    paths:
      - ".github/workflows/mux-en-multihop-replay.yml"
      - "hardware/eeg128-tdm/probe_mux_en_multihop_replay.py"
      - "hardware/eeg128-tdm/probe_mux_en_multihop_route.py"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Pin native KiCad 8.0.9 and Shapely 2.1.2
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
          /usr/bin/python3 -c 'import pcbnew, shapely; assert pcbnew.Version().startswith("8.0.9") and shapely.__version__=="2.1.2"'
      - name: Two independent native KiCad route and source-file replays
        timeout-minutes: 15
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_replay.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/mux-en-independent-replay.json
      - name: Enforce strict replay gate and no manufacturing exports
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/mux-en-independent-replay.json').read_text())
          for key in ('accepted','routing_completed','fabrication_release',
                      'manufacturing_files','checkpoint_promoted',
                      'schematic_parity_qualified'):
              assert d[key] is False, key
          assert d['source_unchanged'] is True
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          assert d['byteidentical_PCB_replay'] is True, d['status']
          assert d['independent_replay_verified'] is True
          PY
      - name: Upload no-release JSON evidence, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mux-en-independent-replay-evidence
          path: /tmp/mux-en-independent-replay.json
          if-no-files-found: ignore
