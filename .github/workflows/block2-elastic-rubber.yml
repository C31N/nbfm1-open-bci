# SPDX-License-Identifier: AGPL-3.0-only
name: Native Block2 Elastic Repulsion Rubber Band CH038 no-release
on:
  workflow_dispatch:
  push:
    branches: [codex/block2-predictive-restitution-2026-10-30]
    paths:
      - ".github/workflows/block2-elastic-rubber.yml"
      - "hardware/eeg128-tdm/probe_block2_elastic_routes.py"
      - "hardware/eeg128-tdm/probe_block2_clearance_cutset.py"
      - "hardware/eeg128-tdm/probe_block2_uuid_detours.py"
      - "hardware/eeg128-tdm/test_block2_elastic_routes.py"
      - "hardware/eeg128-tdm/probe_block2_nbody_201.py"
      - "hardware/eeg128-tdm/probe_block2_macro_voronoi.py"
      - "hardware/eeg128-tdm/probe_block2_cbs_fcu3.py"
permissions:
  contents: read
jobs:
  scratch-elastic-three:
    strategy:
      fail-fast: false
      matrix:
        order: [0, 2, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: kicad/kicad@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native geometry dependencies
        run: |
          set -eu
          test "$(kicad-cli version)" = "8.0.9"
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-shapely python3-pip python3-numpy
          /usr/bin/python3 -m pip install --break-system-packages --ignore-installed --no-deps shapely==2.1.2
      - name: Unit test dynamical repulsion and fail-closed zero-width topology
        run: |
          /usr/bin/python3 -m py_compile hardware/eeg128-tdm/probe_block2_elastic_routes.py hardware/eeg128-tdm/probe_block2_clearance_cutset.py hardware/eeg128-tdm/probe_block2_uuid_detours.py hardware/eeg128-tdm/probe_block2_macro_voronoi.py hardware/eeg128-tdm/probe_block2_nbody_201.py hardware/eeg128-tdm/probe_block2_cbs_fcu3.py
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_elastic_routes.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_macro_voronoi.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_nbody_201.py -v
          /usr/bin/python3 -m unittest discover -s hardware/eeg128-tdm -p test_block2_cbs_fcu3.py -v
      - name: Reproduce strictly protected native 139 source
        timeout-minutes: 8
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_mux_en_multihop_route.py \
            --archive hardware/eeg128-tdm/engineering/block2-ch019-electrode-closed139.zip \
            --output /tmp/elastic-pinned139.json \
            --candidate-output /tmp/elastic-pinned139.zip
      - name: Repulse macro paths, try zero-width spanning trees, inflate on FCu
        timeout-minutes: 16
        run: |
          /usr/bin/python3 hardware/eeg128-tdm/probe_block2_nbody_201.py \
            --candidate /tmp/elastic-pinned139.zip \
            --order ${{ matrix.order }} \
            --elastic-three \
            --output /tmp/elastic-${{ matrix.order }}.json
      - name: Enforce no-release, exact whitelist and native gate
        run: |
          ORDER=${{ matrix.order }} /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path('/tmp/elastic-'+os.environ['ORDER']+'.json').read_text())
          assert d['source_unchanged']
          assert d['elastic_three_enabled'] is True
          assert d['child_exit_code'] == 0, d.get('child_stderr_tail')
          w = d['child_diagnostic']
          assert w is not None
          assert w['original_victim_count'] == 201
          assert len(w['cut_whitelist_UUIDs']) == 201
          assert len(w['CH038_cut_UUIDs']) == 2
          assert not set(w['cut_whitelist_UUIDs']).intersection(w['CH038_cut_UUIDs'])
          for key in ('accepted', 'fabrication_release', 'routing_completed',
                      'manufacturing_files', 'checkpoint_promoted',
                      'independent_replay_verified', 'schematic_parity_qualified'):
              assert d[key] is False and w[key] is False, key
          assert d['new_vias_added'] == w['new_vias_added'] == 0
          if d['candidate_qualified_136']:
              assert d['candidate_native_DRC'] == {
                  'violations': 0, 'warnings': 0, 'unconnected': 136}
              assert w['fully_restituted'] is True
              assert w['component_identity_verified'] is True
          assert not list(Path('/tmp').rglob('*.gbr'))
          assert not list(Path('/tmp').rglob('*.drl'))
          PY
      - name: Publish diagnostics, never fabrication assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Block2-Elastic-${{ matrix.order }}
          path: |
            /tmp/elastic-${{ matrix.order }}.json
            /tmp/elastic-pinned139.json
          if-no-files-found: ignore
